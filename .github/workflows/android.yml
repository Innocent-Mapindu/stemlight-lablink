name: Build Android app
on:
  push:
    branches: [main]
    paths: ["app/**", "assets/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/android@6.2.0 @capacitor/cli@6.2.0
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
      - name: Copy the web app into Android
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk STEMLight-LabLink.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STEMLight-LabLink-apk
          path: STEMLight-LabLink.apk
      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest STEMLight-LabLink.apk \
            --title "STEMLight LabLink for Android (build ${{ github.run_number }})" \
            --notes "Download STEMLight-LabLink.apk on an Android phone and open it to install. You may need to allow installing apps from your browser or file manager. Built automatically from commit ${{ github.sha }}." \
            --target ${{ github.sha }} --latest
