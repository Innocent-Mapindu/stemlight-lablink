name: Check security rules
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1
      - run: npx firebase emulators:exec --only firestore --project demo-lablink "node tests/rules.test.mjs"
