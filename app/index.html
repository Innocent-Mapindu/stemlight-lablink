<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#023d84">
<meta name="description" content="STEMLight LabLink: virtual Physics, Chemistry, Biology and Workshop labs for Zimbabwean learners. A STEMLight Academy product.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:title" content="STEMLight LabLink"><meta property="og:description" content="Virtual science labs for every Zimbabwean learner."><meta property="og:image" content="hero.jpg">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>STEMLight LabLink</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app shell — home (rank, badges, lab cards) → lab (tabs: levels path, apparatus library, free practice) → level (lesson pager → quiz or bench challenge) */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#17221f; --muted:#5a6966; --line:#d3dbd8;
  --navy:#023d84; --orange:#f58300; --accent:var(--navy); --soft:var(--tvet-soft); --phy:#0a6fbf; --phy-soft:#dcecf8; --chem:#c45f00; --chem-soft:#fdebd6; --bio:#3d7a3a; --bio-soft:#e2efe0; --tvet:#023d84; --tvet-soft:#dfe7f3;
  --good:#2f7d4f; --warn:#b4442f; --caution:#c08512; --stage:#f6f8f7; --bench:#e9e4da; --bench-line:#d9d2c4; --glass:#8fa8ae;
  --f-display:"Montserrat",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --panel:#162120; --ink:#e3ebe8; --muted:#93a39f; --line:#2b3a37;
  --navy:#8fbcf0; --orange:#ffa23d; --phy:#6fb6ec; --phy-soft:#16304a; --chem:#ffab4d; --chem-soft:#3a2810; --bio:#86c47f; --bio-soft:#1f3320; --tvet:#9fc0f0; --tvet-soft:#1a2a45;
  --good:#5cc08a; --warn:#ef7a62; --caution:#e8b04a; --stage:#131d1c; --bench:#2a2722; --bench-line:#36322b; --glass:#7d969c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --panel:#162120; --ink:#e3ebe8; --muted:#93a39f; --line:#2b3a37;
  --navy:#8fbcf0; --orange:#ffa23d; --phy:#6fb6ec; --phy-soft:#16304a; --chem:#ffab4d; --chem-soft:#3a2810; --bio:#86c47f; --bio-soft:#1f3320; --tvet:#9fc0f0; --tvet-soft:#1a2a45;
  --good:#5cc08a; --warn:#ef7a62; --caution:#e8b04a; --stage:#131d1c; --bench:#2a2722; --bench-line:#36322b; --glass:#7d969c; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand img{width:36px;height:36px;border-radius:8px;background:#fff;object-fit:contain;padding:2px}
.brand .s{color:var(--navy)} .brand .l{color:var(--orange)} .brand .p{font-weight:600;color:var(--muted);margin-left:4px}
.hero{border-radius:14px;overflow:hidden;background:#fff url(hero.jpg) center/cover no-repeat;display:grid;place-items:center;padding-block:18px}
.hero img{width:min(280px,72%);height:auto;display:block;mix-blend-mode:multiply}
.tagline{font-family:var(--f-display);font-weight:700;color:var(--orange);letter-spacing:.02em;margin:4px 0 0}
.crumbs{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{min-height:36px;padding:4px 10px;font-weight:500}
h1{color:var(--navy);font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4.5vw,2.4rem);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted)}
.lead{color:var(--muted);margin:6px 0 0;max-width:64ch}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent,var(--muted));margin:0 0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.lab3d{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-left:4px solid var(--orange);margin-bottom:14px}
.labs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.labcard{display:grid;gap:10px;text-align:left;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink);font:inherit;min-height:0}
.labcard:hover{border-color:var(--accent)}
.labcard .ic{width:52px;height:52px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.labcard .ic svg{width:34px;height:34px}
.labcard h3{font-family:var(--f-display);font-size:1.25rem;margin:0}
.labcard p{margin:0;color:var(--muted);font-size:.9rem}
.labcard .meta{font-family:var(--f-mono);font-size:.74rem;color:var(--accent)}
.plist{display:grid;gap:10px}
.prow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.prow .t{font-weight:600}
.prow .d{font-size:.86rem;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.full{border-color:var(--accent);color:var(--accent);background:var(--soft)}
a.btnlink,button{font-family:var(--f-body);font-weight:600;font-size:.92rem;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,a.btnlink:hover{border-color:var(--accent,var(--muted))}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent,var(--phy));outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#0e1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0e1514}}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 140px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{font-size:.78rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);text-align:center;line-height:1.25}
.step b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.7rem}
.step.on{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.step.done{color:var(--good);border-color:var(--good)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:500;font-size:.78rem;line-height:1.2;text-align:center;min-height:96px}
.item svg{width:40px;height:40px;color:var(--accent)}
.item[aria-pressed=true]{background:var(--soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tray{min-height:64px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:var(--bench)}
.tray .chip{display:flex;align-items:center;gap:4px;font-size:.78rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px}
.tray .chip svg{width:22px;height:22px;color:var(--accent)}
.tray .none{color:var(--muted);font-size:.85rem;padding:12px}
.steps{display:grid;gap:8px}
.steps button{justify-content:flex-start;text-align:left;font-weight:500;line-height:1.35}
.steps .ok{background:var(--soft);border-color:var(--good);color:var(--ink)}
.steps .ok::before{content:"✓";color:var(--good);font-weight:700;margin-right:4px}
.msg{font-size:.88rem;padding:10px 12px;border-radius:8px;background:var(--soft,var(--phy-soft));color:var(--ink);border-left:3px solid var(--accent)}
.msg.warn{border-left-color:var(--warn)} .msg.good{border-left-color:var(--good)} .msg.caution{border-left-color:var(--caution)}
.bench{position:relative;background:var(--bench);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bench canvas.main{display:block;width:100%;height:360px;touch-action:pan-y}
@media (max-width:600px){.bench canvas.main{height:300px}}
.mag{position:absolute;right:8px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center}
.mag canvas{display:block;width:150px;height:70px;touch-action:pan-y}
.mag.tall canvas{width:110px;height:130px}
.tag2{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hud{position:absolute;left:8px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.hud .v{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1.2}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.ctl label{display:flex;justify-content:space-between;font-size:.88rem;font-weight:500}
.ctl label span{font-family:var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.field{display:grid;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:.84rem;font-weight:500}
input[type=number],select{font-family:var(--f-mono);font-size:1rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px;padding:6px 12px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.86rem}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;color:var(--muted)}
td{font-family:var(--f-mono)}
th:first-child,td:first-child{text-align:left}
tr.bad td{color:var(--warn)}
canvas.graph{display:block;width:100%;height:250px;touch-action:pan-y}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.res .k{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res .v{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.res .v.big{color:var(--accent);font-size:1.45rem}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0}
.report .line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0;font-size:.92rem}
.report .line span:last-child{font-family:var(--f-mono);text-align:right}
.verdict{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--accent);margin:0}
.p-good{color:var(--good)} .p-warn{color:var(--warn)}
footer{font-size:.8rem;color:var(--muted);text-align:center;padding-top:8px}
.hud2{display:grid;gap:4px;min-width:150px;flex:0 1 220px}
.hudtxt{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}
.rank{font-family:var(--f-display);font-weight:800;color:var(--navy)}
.muted{color:var(--muted)}
.xpbar,.lbar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i,.lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--orange));border-radius:99px}
.lbar i{background:var(--accent)}
.prog{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.prog .rank{font-size:1.4rem}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);opacity:.45;filter:grayscale(1)}
.badge svg{width:42px;height:42px;padding:7px;border-radius:50%;border:2px solid var(--line);color:var(--muted)}
.badge.on{opacity:1;filter:none;color:var(--ink)}
.badge.on svg{border-color:var(--orange);color:var(--accent);background:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.path{display:grid;gap:10px}
.lvl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.lvl .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;border:2px solid var(--accent);color:var(--accent);background:var(--soft)}
.lvl.done .num{background:var(--accent);color:var(--panel)}
.lvl.locked{opacity:.62}
.lvl.locked .num{border-color:var(--line);color:var(--muted);background:var(--panel)}
.lvl .t{font-weight:700}
.lvl .d{font-size:.86rem;color:var(--muted)}
.lvl .kind{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-left:6px}
.lvl .act{text-align:right;font-size:.82rem}
@media (max-width:540px){.lvl{grid-template-columns:46px minmax(0,1fr)} .lvl .act{grid-column:1/-1;text-align:left} .lvl .act button{width:100%}}
.stars{color:var(--orange);letter-spacing:2px}
.stars .off{color:var(--line)}
.applist{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.applist{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.appd{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.appd summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.appd summary::-webkit-details-marker{display:none}
.appd summary svg{width:40px;height:40px;flex:none;color:var(--accent)}
.appd summary span{display:grid;gap:2px;min-width:0;font-size:.86rem}
.appd summary b{font-size:.95rem}
.appd[open]{border-color:var(--accent)}
.appbody{padding:0 14px 12px 62px;font-size:.9rem}
.appbody p{margin:6px 0}
.appbody .tip{background:var(--soft);padding:8px 10px;border-radius:8px}
.lesson{display:grid;gap:12px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:240px;min-width:0}
.lcard h3{font-family:var(--f-display);color:var(--accent);font-size:1.18rem;margin:0 0 10px;text-wrap:balance}
.lcard .pgno{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);float:right}
.lp{max-width:70ch}
.lp p,.lp li{line-height:1.55}
.lp ol,.lp ul{padding-left:1.3em;display:grid;gap:4px}
.lp .tbl{margin:10px 0}
.lp td{font-family:var(--f-body);white-space:normal;text-align:left}
.lp th{text-align:left}
.lp svg{color:var(--ink)}
.applearn{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.appc{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.appc svg{width:40px;height:40px;flex:none;color:var(--accent)}
.appc p{margin:4px 0 0;font-size:.88rem}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.linkish{border:0;background:none;color:var(--accent);text-decoration:underline;min-height:36px;justify-self:center}
.two-step{grid-template-columns:repeat(2,minmax(0,1fr))}
.quiz .q{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0 0 12px;line-height:1.35}
.opts{display:grid;gap:8px}
.opts button{justify-content:flex-start;text-align:left;font-weight:500;line-height:1.35;white-space:normal}
.opts button.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.opts button.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.opts button:disabled{opacity:1;cursor:default}
.qbar{display:flex;gap:4px}
.qbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--good)} .qbar i.no{background:var(--warn)} .qbar i.on{background:var(--accent)}
.result{text-align:center}
.result h2{justify-content:center}
.bigstars{font-size:2.6rem;margin:0;line-height:1.1}
.xpgain{font-family:var(--f-display);font-weight:800;color:var(--orange);font-size:1.2rem}
a.btnlink.primary-link{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--panel);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.2)}
footer label{color:var(--ink)}
input[type=text],input[type=date],input[type=search],input[type=tel],input:not([type]),textarea{box-sizing:border-box;font-family:var(--f-body);font-size:1rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.45}
#view>*{min-width:0}
.qctx{white-space:pre-wrap;font-family:var(--f-mono);font-size:.84rem;background:var(--bench);border-radius:8px;padding:10px 12px;margin:0 0 10px;overflow-x:auto;max-height:340px}
.qbar i.part{background:var(--caution)} .qbar i.ans{background:var(--muted)} .qbar i.cur{outline:2px solid var(--accent);outline-offset:1px}
.opts button.picked{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opts button b{color:var(--muted);margin-right:4px}
.qmiss,.qmodel{margin-top:10px;font-size:.92rem} .qmiss ul{margin:4px 0 0;padding-left:1.2em} .qmodel p{margin:4px 0 0}
.topicgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tcard{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tcard .t{font-weight:700} .tcard .d{font-size:.82rem;color:var(--muted)} .tcard button{min-height:38px}
.line2{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,120px) 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.line2 b{text-align:right;font-family:var(--f-mono)}
.qe{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.qe summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;cursor:pointer}
.qe .qsum{color:var(--muted);font-size:.86rem;min-width:0;flex:1 1 200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qe[open]{border-color:var(--navy)}
.qebody{display:grid;gap:10px;padding:0 12px 12px}
.pill.chk{border-color:var(--warn);color:var(--warn);font-weight:600}
.qreview{display:grid;gap:10px;margin-top:12px}
.qr{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px}

const LEVELS={
 physics:[
  {title:"Know your apparatus",blurb:"Meet the instruments of the physics lab and what each one is for.",lesson:"apparatus",quiz:"apparatus"},
  {title:"Measure like a scientist",blurb:"Resolution, zero error, parallax, and reading the vernier and micrometer.",cards:[
    {h:"Resolution: the smallest step you can read",p:"Every instrument can only be read to its smallest division. Record your readings to that precision: no more, and no less."+tbl(["Instrument","Reads to"],[["Metre rule","1 mm"],["Vernier calipers","0.1 mm"],["Micrometer screw gauge","0.01 mm"],["Stopwatch","0.01 s (but reaction time is about 0.2 s)"],["Thermometer","0.5 °C or 1 °C"],["Top-pan balance","0.01 g"]])},
    {h:"Zero error",p:"If an instrument does not read zero when it should, every reading is shifted by the same amount. Close the jaws, or look at the empty scale, before you measure.<p><b>Corrected reading = reading − zero error.</b></p><p>Example: a micrometer reads +0.02 mm with its jaws closed. A wire then reads 1.37 mm, so its true diameter is 1.37 − 0.02 = <b>1.35 mm</b>.</p>"},
    {h:"Parallax error",p:"Reading a scale from an angle makes the reading too high or too low. Put your eye level with the mark and directly in front of it.<p>For liquids, read the <b>bottom of the meniscus</b> at eye level. For a pointer near a scale, line up the pointer with its reflection if the scale has a mirror strip.</p>"},
    {h:"Reading vernier calipers",p:"<ol><li>Read the main scale just to the left of the vernier zero. Example: <b>23 mm</b>.</li><li>Find the vernier mark that lines up exactly with a main-scale mark. Example: mark <b>4</b>, which means 0.4 mm.</li><li>Add them: 23 + 0.4 = <b>23.4 mm</b>.</li></ol>"},
    {h:"Reading a micrometer",p:"<ol><li>Read the sleeve: the whole millimetres above the line, plus 0.5 mm if a half-millimetre mark below the line shows past the last whole mark. Example: <b>6.5 mm</b>.</li><li>Read the thimble division that sits on the datum line. Example: <b>18</b>, which means 0.18 mm.</li><li>Add them: 6.5 + 0.18 = <b>6.68 mm</b>.</li></ol>"},
    {act:"vernier",h:"Try it: read the instruments"},
    {h:"Reducing random error",p:"<ul><li>Repeat each reading and take the mean.</li><li>Measure many together: time 20 oscillations, or measure the thickness of 100 sheets of paper.</li><li>Plot a graph and use the best-fit line, which averages out the scatter.</li></ul><p>Repeating does <b>not</b> remove a zero error. That is a systematic error, which must be corrected.</p>"}
   ],quiz:[
    {q:"What is the resolution of a metre rule?",a:["1 mm","1 cm","0.1 mm","0.01 mm"],e:"A metre rule is marked in millimetres, so it reads to the nearest 1 mm."},
    {q:"A micrometer reads +0.03 mm with its jaws closed. A wire then reads 2.48 mm. What is the true diameter?",num:2.45,tol:0.001,unit:"mm",e:"Corrected reading = reading − zero error = 2.48 − 0.03 = 2.45 mm."},
    {q:"Why do you time 20 oscillations of a pendulum instead of one?",a:["To reduce the effect of reaction-time error","Because the pendulum swings faster later","Because the stopwatch is more accurate after 20 s","To make the swings smaller"],e:"Your reaction time error is the same whatever you time, so spreading it over 20 oscillations makes it 20 times smaller per oscillation."},
    {q:"How do you avoid parallax error when reading a scale?",a:["Put your eye level with the mark, directly in front of it","Read the scale from slightly above","Take the reading quickly","Use a longer scale"],e:"Looking at the mark from an angle shifts the apparent reading."},
    {q:"On vernier calipers, the vernier zero is just past 23 mm on the main scale, and vernier mark 4 lines up. What is the reading?",a:["23.4 mm","23.04 mm","27 mm","2.34 mm"],e:"Main scale 23 mm plus 4 × 0.1 mm from the vernier gives 23.4 mm."},
    {q:"A micrometer sleeve shows 6.5 mm and the thimble reads 18 on the datum line. What is the reading?",num:6.68,tol:0.001,unit:"mm",e:"6.5 mm from the sleeve plus 0.18 mm from the thimble gives 6.68 mm."},
    {q:"Which instrument is best for measuring the diameter of a wire about 0.3 mm thick?",a:["Micrometer screw gauge","Metre rule","Vernier calipers","Protractor"],e:"Only the micrometer reads to 0.01 mm, which is needed for such a small diameter."},
    {q:"Repeating a measurement and taking the mean reduces which type of error?",a:["Random error","Zero error","All systematic errors","Parallax error only"],e:"Averaging cancels random scatter, but a systematic error such as a zero error shifts every reading the same way."}
   ]},
  {title:"Sample experiment: the simple pendulum",blurb:"Follow a complete practical from method to the value of g.",cards:[
    {h:"Aim and theory",p:"<b>Aim:</b> find the acceleration due to gravity, g, using a simple pendulum.<p>For small swings, the period is <b>T = 2π√(l/g)</b>. Squaring gives <b>T² = (4π²/g) × l</b>, so a graph of T² against l is a straight line through the origin with gradient 4π²/g.</p><p><b>g = 4π² ÷ gradient.</b></p>"},
    {h:"Apparatus",p:"<div class='appgrid'>"+["stand","ruler","stopwatch","protractor"].map(id=>`<div class="appc">${svgI(id)}<div><b>${NAMES[id]==="30 cm ruler"?"Metre rule":NAMES[id]}</b></div></div>`).join("")+"</div><p>You also need thread, a small heavy bob, two small pieces of wood to clamp the thread, and a pin as a fiducial (reference) marker below the bob.</p>"},
    {h:"Method",p:"<ol><li>Clamp the thread between two pieces of wood so the top point is fixed.</li><li>Set the length l, from the point of suspension to the <b>centre of the bob</b>, to 0.30 m.</li><li>Displace the bob through a small angle (under 10°) and release it.</li><li>Start the stopwatch as the bob passes the fiducial marker, count 20 oscillations, and stop.</li><li>Repeat the timing and take the mean. T = t ÷ 20.</li><li>Repeat for l = 0.45, 0.60, 0.75 and 0.90 m.</li></ol>"},
    {h:"Sample results",p:tbl(["l / m","t for 20 / s","T / s","T² / s²"],[["0.30","22.05","1.103","1.216"],["0.45","26.84","1.342","1.801"],["0.60","31.12","1.556","2.421"],["0.75","34.70","1.735","3.010"],["0.90","38.10","1.905","3.629"]])+"<p>Notice that T is calculated to 3 decimal places from a time read to 0.01 s.</p>"},
    {h:"Graph and calculation",p:PEND_GRAPH+"<p>The points lie on a straight line through the origin. Using a large triangle, gradient = 4.02 s²/m.</p><p><b>g = 4π² ÷ 4.02 = 9.81 m/s².</b></p>"},
    {h:"Errors and improvements",p:"<ul><li>Reaction time: time many oscillations, and start the count at zero as you press start.</li><li>Keep the amplitude below 10°, or T becomes longer than the formula predicts.</li><li>Measure l to the centre of the bob.</li><li>Use a fiducial marker at the lowest point, where the bob moves fastest and the timing is sharpest.</li></ul>"+tryLink(LINK.pend,"Try the full pendulum simulation")}
   ],quiz:[
    {q:"In a graph of T² against l for a simple pendulum, how is g found?",a:["g = 4π² ÷ gradient","g = gradient ÷ 4π²","g = 4π² × gradient","g = 2π ÷ gradient"],e:"T² = (4π²/g) l, so the gradient is 4π²/g and g = 4π² ÷ gradient."},
    {q:"20 oscillations take 31.0 s. What is the period T, in seconds?",num:1.55,tol:0.001,unit:"s",e:"T = 31.0 ÷ 20 = 1.55 s."},
    {q:"Where should you start and stop the stopwatch?",a:["As the bob passes the fiducial marker at the lowest point","When the bob is at the top of its swing","When you let go of the bob","Whenever the bob seems slowest"],e:"At the lowest point the bob moves fastest, so the moment it passes the marker is sharpest."},
    {q:"Why must the angle of swing be kept small?",a:["The formula T = 2π√(l/g) only holds for small swings","Large swings make the thread stretch","Small swings are easier to count","The stopwatch cannot time large swings"],e:"For large amplitudes the period gets longer than the small-angle formula predicts."},
    {q:"The length l of the pendulum is measured from the point of suspension to:",a:["the centre of the bob","the top of the bob","the bottom of the bob","the floor"],e:"The pendulum behaves as if all its mass were at the centre of the bob."},
    {q:"The gradient of T² against l is 4.00 s²/m. What is g, in m/s²? (Give 3 significant figures.)",num:9.87,tol:0.01,unit:"m/s²",e:"g = 4π² ÷ 4.00 = 9.87 m/s²."},
    {q:"If the length of a pendulum is made four times longer, the period becomes:",a:["2 times longer","4 times longer","16 times longer","the same"],e:"T is proportional to √l, and √4 = 2."},
    {q:"Which graph gives a straight line through the origin for a pendulum?",a:["T² against l","T against l","T against l²","l against 1/T"],e:"T² = (4π²/g) l, which is the form y = mx."}
   ]},
  {title:"Electric circuits",blurb:"Symbols, meters, Ohm's law and resistance of a wire.",cards:[
    {h:"Circuit symbols",p:SYMBOLS+"<p>Exam diagrams use these symbols. Draw wires as straight lines with square corners.</p>"},
    {h:"Series and parallel",p:"<ul><li><b>Series:</b> one path. The same current flows through every component, and the potential differences add up to the supply voltage.</li><li><b>Parallel:</b> separate branches. Each branch has the same potential difference, and the branch currents add up to the total current.</li></ul>"},
    {h:"Connecting the meters",p:"<ul><li>An <b>ammeter</b> goes in <b>series</b>. It has almost no resistance, so across a component it would short-circuit it.</li><li>A <b>voltmeter</b> goes in <b>parallel</b>. It has a very high resistance, so in series it almost stops the current.</li><li>Join + on each meter towards + on the supply.</li></ul>"},
    {h:"Ohm's law",p:"<p><b>V = I × R</b>, so <b>R = V ÷ I</b>.</p><p>Example: 6.0 V across a resistor gives a current of 0.30 A, so R = 6.0 ÷ 0.30 = <b>20 Ω</b>.</p><p>For a fixed resistor at constant temperature, the I–V graph is a straight line through the origin. For a filament lamp it curves, because the filament heats up and its resistance rises.</p>"+tryLink(LINK.ohm,"Try the Ohm's law circuit simulation")},
    {h:"Resistance of a wire",p:"<ul><li>R is proportional to length: double the length, double the resistance.</li><li>R is inversely proportional to cross-sectional area: a thicker wire has less resistance.</li><li>Resistivity: <b>ρ = RA ÷ l</b>, a property of the metal.</li></ul>"+tryLink(LINK.wire,"Try the resistance of a wire simulation")},
    {h:"Working safely",p:"<ul><li>Use low voltages from a power pack or cells.</li><li>Check the circuit before switching on.</li><li>Switch off between readings so wires and components do not heat up and change their resistance.</li></ul>"}
   ],quiz:[
    {q:"How is an ammeter connected in a circuit?",a:["In series with the component","In parallel across the component","Across the battery","Either way"],e:"An ammeter must carry the same current as the component, so it goes in series."},
    {q:"A resistor has 6.0 V across it and a current of 0.30 A. What is its resistance, in ohms?",num:20,tol:0.01,unit:"Ω",e:"R = V ÷ I = 6.0 ÷ 0.30 = 20 Ω."},
    {q:"A student connects a voltmeter in series with a lamp. What happens?",a:["Almost no current flows","The lamp is brighter","The voltmeter reads zero","The fuse blows"],e:"The voltmeter's very high resistance almost stops the current, so the lamp does not light."},
    {q:"What is a rheostat used for?",a:["Changing the current in a circuit","Measuring current","Measuring voltage","Storing charge"],e:"A rheostat is a variable resistor, so changing its resistance changes the current."},
    {q:"Why does the I–V graph of a filament lamp curve?",a:["Its resistance rises as the filament gets hotter","Its resistance falls as it gets hotter","The voltmeter is inaccurate","The current is too small"],e:"Hotter metal has a higher resistance, so the current rises less for each extra volt."},
    {q:"Two 4 Ω resistors are connected in series. What is the total resistance, in ohms?",num:8,tol:0.01,unit:"Ω",e:"Resistances in series add: 4 + 4 = 8 Ω."},
    {q:"If the length of a wire is doubled, its resistance:",a:["doubles","halves","stays the same","is four times bigger"],e:"Resistance is proportional to length."},
    {q:"In a parallel circuit, which quantity is the same across every branch?",a:["Potential difference","Current","Resistance","Power"],e:"Each branch is connected across the same two points, so it has the same p.d."}
   ]},
  {title:"Lab challenge: refraction",blurb:"Collect the apparatus, set up, take readings and find the refractive index of glass.",prac:"refraction",cards:[
    {h:"Your challenge",p:"Find the refractive index of a glass block. You will:<ol><li>choose the right apparatus from the shelf,</li><li>set up in the right order,</li><li>measure the angle of refraction for several angles of incidence,</li><li>plot sin i against sin r and find the gradient.</li></ol><p>Score <b>60 or more out of 100</b> to complete the Physics Lab.</p>"},
    {h:"Remember",p:"<ul><li>Angles are measured from the <b>normal</b>.</li><li>Use a wide range of angles, from 10° to 70°.</li><li>The refractive index is n = sin i ÷ sin r, the gradient of your graph.</li></ul>"}
   ]}

 chemistry:[

  {title:"Lab safety",blurb:"The Bunsen burner, heating, acids and hazard symbols.",cards:[
    {h:"Before you start",p:"<ul><li>Wear safety goggles for the whole practical.</li><li>Tie back long hair and tuck in loose clothing.</li><li>Keep bags off the bench and never eat or drink in the lab.</li><li>Know where the eyewash, fire blanket and first-aid kit are.</li></ul>"},
    {h:"The Bunsen burner",p:"<ul><li>Light it with the <b>air hole closed</b>. This gives a yellow, luminous <b>safety flame</b> that is easy to see.</li><li>Open the air hole for a <b>blue roaring flame</b>. This is the hottest flame, and it is almost invisible.</li><li>Return to the safety flame whenever you are not heating.</li></ul>"},
    {h:"Heating safely",p:"<ul><li>Hold a test tube with a test-tube holder, tilted, and point the open end away from everyone.</li><li>Heat gently near the top of the liquid and keep the tube moving, so it does not spit out.</li><li>Never heat a closed container.</li></ul>"},
    {h:"Acids and alkalis",p:"<ul><li>To dilute a concentrated acid, add the <b>acid slowly to water</b>, never water to acid.</li><li>If acid or alkali gets on your skin, wash it with plenty of running water.</li><li>Alkalis such as sodium hydroxide are at least as dangerous to the eyes as acids.</li></ul>"},
    {h:"Hazard symbols",p:tbl(["Hazard","What it means","Example"],[["Corrosive","Destroys skin and attacks metals","Concentrated acids, sodium hydroxide"],["Flammable","Catches fire easily","Ethanol"],["Toxic","Can cause death in small amounts","Lead compounds"],["Oxidising","Makes other materials burn more fiercely","Potassium manganate(VII)"],["Harmful or irritant","Irritates skin, eyes or lungs","Dilute acids"],["Environmental hazard","Harms living things in water","Copper(II) sulfate"]])},
    {h:"Gases and waste",p:"<ul><li>To smell a gas, <b>waft</b> it towards your nose with your hand.</li><li>Use a fume cupboard for toxic gases such as chlorine.</li><li>Dispose of waste as your teacher says, and put broken glass in the glass bin.</li></ul>"}

    {q:"What does the Bunsen burner's safety flame look like?",a:["Yellow and luminous, air hole closed","Blue and roaring, air hole open","Invisible, air hole half open","Green, air hole closed"],e:"With the air hole closed the flame is yellow and easy to see, so it is safe to leave burning."},
    {q:"Which Bunsen flame is the hottest?",a:["Blue roaring flame, air hole open","Yellow flame, air hole closed","Orange flame","They are all the same"],e:"Opening the air hole gives complete combustion and the hottest flame."},
    {q:"How should a concentrated acid be diluted?",a:["Add the acid slowly to water","Add water quickly to the acid","Add water slowly to the acid","Mix them in a closed bottle"],e:"Adding acid to water lets the heat released spread through a lot of water, so it does not spit."},

    {q:"A bottle has the corrosive hazard symbol. What does this mean?",a:["It destroys living tissue and attacks metals","It catches fire easily","It makes other things burn","It harms aquatic life"],e:"Corrosive substances such as concentrated acids destroy skin and metals."},

  {title:"Volumes and titration technique",blurb:"Read a burette, choose indicators, find concordant titres and calculate.",cards:[
    {h:"Choosing apparatus for volumes",p:tbl(["Apparatus","Use","Precision"],[["Beaker","Holding and mixing","Rough only"],["Measuring cylinder","Quick volumes","About ±0.5 cm³"],["Pipette","One exact volume, such as 25.0 cm³","±0.06 cm³"],["Burette","Any volume up to 50 cm³","Read to 0.05 cm³"]])},
    {h:"Reading the meniscus",p:"<ul><li>Put your eye level with the liquid surface.</li><li>For colourless solutions, read the <b>bottom of the meniscus</b>.</li><li>A burette reads <b>downwards</b>: 0 at the top, 50 at the bottom.</li><li>Record burette readings to <b>2 decimal places</b>, ending in 0 or 5, such as 23.40 or 23.45.</li></ul>"},
    {act:"burette",h:"Try it: read the burette"},
    {h:"Titration method",p:"<ol><li>Rinse the burette with the acid, fill it, remove the funnel, and record the initial reading.</li><li>Use a pipette and filler to put 25.0 cm³ of alkali in a conical flask.</li><li>Add 2 or 3 drops of indicator and stand the flask on a white tile.</li><li>Run in acid while swirling. Near the end point, add it drop by drop.</li><li>Stop at the first permanent colour change and record the final reading.</li></ol>"},
    {h:"Indicators",p:tbl(["Indicator","In acid","In alkali","End point"],[["Methyl orange","Red","Yellow","Orange"],["Phenolphthalein","Colourless","Pink","Colourless"]])},
    {h:"Concordant titres and the mean",p:tbl(["Titration","Rough","1","2","3"],[["Titre / cm³","24.10","23.65","23.70","23.95"]])+"<p>Titres 1 and 2 are within 0.10 cm³ of each other, so they are <b>concordant</b>. The rough titre is never used.</p><p>Mean titre = (23.65 + 23.70) ÷ 2 = <b>23.68 cm³</b>.</p>"},
    {h:"The calculation",p:"<p>NaOH + HCl → NaCl + H₂O (1 : 1)</p><ol><li>Moles of NaOH = 0.100 × 25.0 ÷ 1000 = 0.00250 mol</li><li>Moles of HCl = 0.00250 mol (1 : 1 ratio)</li><li>If the titre is 20.0 cm³: concentration of HCl = 0.00250 ÷ 0.0200 = <b>0.125 mol/dm³</b></li></ol>"+tryLink(LINK.titr,"Try the full titration simulation")}
   ],quiz:[
    {q:"How should a burette reading be recorded?",a:["23.45","23.4","23.453","23"],e:"Burette readings are recorded to 2 decimal places, ending in 0 or 5."},
    {q:"Titres are concordant when they agree to within:",a:["0.10 cm³","1.00 cm³","0.50 cm³","0.01 cm³"],e:"Two titres within 0.10 cm³ of each other are concordant."},
    {q:"Titres: rough 24.10, then 23.65, 23.70 and 23.95 cm³. What is the mean of the concordant titres, in cm³?",num:23.68,tol:0.006,unit:"cm³",e:"23.65 and 23.70 are concordant. (23.65 + 23.70) ÷ 2 = 23.675, which rounds to 23.68 cm³."},
    {q:"Which may the conical flask be rinsed with before a titration?",a:["Distilled water","The acid from the burette","The alkali being titrated","Ethanol"],e:"Water does not change the number of moles of alkali added by the pipette."},
    {q:"What colour is phenolphthalein in an alkali?",a:["Pink","Colourless","Yellow","Red"],e:"Phenolphthalein is pink in alkali and colourless in acid."},
    {q:"25.0 cm³ of 0.100 mol/dm³ NaOH is neutralised by 20.0 cm³ of HCl. What is the concentration of the HCl, in mol/dm³?",num:0.125,tol:0.0006,unit:"mol/dm³",e:"Moles NaOH = 0.00250 = moles HCl. 0.00250 ÷ 0.0200 dm³ = 0.125 mol/dm³."},
    {q:"Why is a white tile placed under the conical flask?",a:["To see the colour change clearly","To keep the flask warm","To stop the flask slipping","To protect the bench from acid"],e:"The white background makes the end-point colour change easy to spot."},
    {q:"Where do you read the burette scale for a colourless solution?",a:["At the bottom of the meniscus, at eye level","At the top of the meniscus","Anywhere on the curve","From above the burette"],e:"Read the bottom of the meniscus with your eye level with it to avoid parallax."}
   ]},
  {title:"Tests for ions and gases",blurb:"Identify gases, metal ions and anions from what you observe.",cards:[
    {h:"Tests for gases",p:tbl(["Gas","Test","Positive result"],[["Hydrogen","Lighted splint","Squeaky pop"],["Oxygen","Glowing splint","Relights"],["Carbon dioxide","Bubble through limewater","Limewater turns milky"],["Ammonia","Damp red litmus paper","Turns blue"],["Chlorine","Damp litmus paper","Bleached white"]])},
    {h:"Metal ions with sodium hydroxide",p:"Add aqueous sodium hydroxide a few drops at a time, then in excess."+tbl(["Ion","Precipitate","In excess NaOH"],[["Cu²⁺","Light blue","Insoluble"],["Fe²⁺","Green","Insoluble"],["Fe³⁺","Red-brown","Insoluble"],["Zn²⁺","White","Dissolves, colourless solution"],["Al³⁺","White","Dissolves, colourless solution"],["Ca²⁺","White","Insoluble"]])+"<p>Zn²⁺ and Al³⁺ look the same with NaOH. Use aqueous ammonia to tell them apart: zinc hydroxide dissolves in excess ammonia, aluminium hydroxide does not.</p>"},
    {act:"cations",h:"Try it: test the solutions"},

 biology:[
  {title:"Know your apparatus",blurb:"Meet the equipment and reagents of the biology lab.",lesson:"apparatus",quiz:"apparatus"},
  {title:"Using the microscope",blurb:"Parts, magnification, preparing a slide and focusing properly.",cards:[
    {h:"Parts of the light microscope",p:tbl(["Part","Job"],[["Eyepiece lens","The lens you look through, usually ×10"],["Objective lenses","×4, ×10 and ×40; magnify the specimen"],["Stage and clips","Hold the slide"],["Coarse focus","Large movements, for low power only"],["Fine focus","Small movements, for sharp focus at any power"],["Light source or mirror","Lights the specimen from below"],["Diaphragm","Controls how much light passes"]])},
    {h:"Magnification",p:"<p><b>Total magnification = eyepiece × objective.</b> Example: ×10 eyepiece with ×40 objective = <b>×400</b>.</p><p>From a drawing or photo: <b>magnification = image size ÷ actual size</b>, with both in the same units. 1 mm = 1000 µm.</p><p>Example: an image 50 mm long of a cell 0.1 mm long has magnification 50 ÷ 0.1 = <b>×500</b>.</p>"},
    {h:"Preparing an onion epidermis slide",p:"<ol><li>Put a drop of iodine solution in the centre of a clean slide.</li><li>Peel a thin layer of epidermis from the inside of an onion scale leaf with forceps.</li><li>Lay it flat in the drop without folding it.</li><li>Lower a cover slip at an angle with a mounted needle, so no air bubbles are trapped.</li><li>Blot away excess stain with paper towel.</li></ol>"},
    {h:"Focusing correctly",p:"<ol><li>Start with the <b>lowest-power</b> objective (×4).</li><li>Watching from the side, bring the objective close to the slide.</li><li>Looking through the eyepiece, focus by moving them apart with the coarse focus.</li><li>Move the area you want to the centre, then switch to a higher-power objective.</li><li>At high power use the <b>fine focus only</b>, so the lens does not hit the slide.</li></ol>"},
    {act:"microscope",h:"Try it: focus the microscope"},
    {h:"Biological drawings",p:"<ul><li>Use a sharp pencil and clear, continuous lines. No shading.</li><li>Draw what you see, large, filling at least half the space.</li><li>Rule label lines that do not cross, and write labels outside the drawing.</li><li>Add a title and the magnification.</li></ul>"}
   ],quiz:[
    {q:"A microscope has a ×10 eyepiece and a ×40 objective. What is the total magnification?",num:400,tol:0.1,unit:"×",e:"Total magnification = 10 × 40 = ×400."},
    {q:"Which objective should you start focusing with?",a:["The lowest power, ×4","The highest power, ×40","The ×10","Any of them"],e:"Low power gives the widest view and the most room to focus safely."},
    {q:"Why is the cover slip lowered at an angle?",a:["To avoid trapping air bubbles","To spread the stain","To stop the slide breaking","To keep the specimen warm"],e:"Lowering it at an angle pushes air out ahead of it."},
    {q:"An image is 50 mm long and the actual cell is 0.1 mm long. What is the magnification?",num:500,tol:0.1,unit:"×",e:"Magnification = image size ÷ actual size = 50 ÷ 0.1 = ×500."},
    {q:"Which stain is used for onion epidermis cells?",a:["Iodine solution","Biuret reagent","Benedict's solution","Limewater"],e:"Iodine stains the nucleus and cytoplasm so they are easier to see."},

  {title:"Food tests",blurb:"Test foods for starch, reducing sugar, protein and fat.",cards:[
    {h:"Why we test foods",p:"Each test shows whether one group of nutrients is present. Always test water as well, as a <b>control</b>, so you can compare colours."},
    {h:"Starch: iodine test",p:"Add a few drops of iodine solution.<ul><li>Positive: orange-brown turns <b>blue-black</b>.</li><li>Negative: stays orange-brown.</li></ul>"},
    {h:"Reducing sugar: Benedict's test",p:"Add an equal volume of Benedict's solution and <b>heat in a hot water bath</b> (about 80 °C) for about 5 minutes.<ul><li>Positive: blue turns green, yellow, orange or <b>brick-red</b>. The further along this sequence, the more sugar.</li><li>Negative: stays blue.</li></ul><p>Sucrose is not a reducing sugar, so it gives a negative result.</p>"},

    {act:"foodtests",h:"Try it: the food test bench"}

    {q:"What colour shows a positive iodine test for starch?",a:["Blue-black","Brick-red","Purple","Cloudy white"],e:"Iodine turns from orange-brown to blue-black when starch is present."},

  {title:"Diffusion and osmosis",blurb:"Water potential, plant and animal cells, and the potato experiment.",cards:[
    {h:"Diffusion",p:"<b>Diffusion</b> is the net movement of particles from a region of higher concentration to a region of lower concentration, down a concentration gradient, as a result of their random movement."},
    {h:"Osmosis",p:"<b>Osmosis</b> is the net movement of water molecules from a region of higher water potential (a dilute solution) to a region of lower water potential (a concentrated solution), through a partially permeable membrane."},
    {h:"Plant and animal cells",p:tbl(["Cell","In pure water","In concentrated solution"],[["Plant cell","Becomes turgid; the wall stops it bursting","Becomes flaccid, then plasmolysed"],["Red blood cell","Swells and bursts","Shrinks"]])},
    {h:"The potato experiment",p:"Equal potato cylinders are weighed, left in sucrose solutions for 30 minutes, blotted and reweighed.<p><b>% change in mass = (final − initial) ÷ initial × 100</b></p><p>Example: 2.50 g → 2.80 g is a change of +0.30 g, which is +12%.</p><p>Use % change because the starting masses are not all the same.</p>"},
    {h:"Reading the graph",p:"<ul><li>Below the isotonic point, cylinders gain mass: the solution has a higher water potential than the cells.</li><li>Above it, they lose mass.</li><li>Where the line crosses zero, there is no net movement of water: the solution has the same water potential as the cell sap.</li></ul>"}
   ],quiz:[
    {q:"Which is the correct definition of osmosis?",a:["Net movement of water molecules from higher to lower water potential through a partially permeable membrane","Movement of any particles from low to high concentration","Movement of sugar through a membrane","Active transport of water using energy"],e:"Osmosis is specifically about water moving through a partially permeable membrane, down a water potential gradient."},
    {q:"A potato cylinder is left in pure water. What happens to its mass?",a:["It increases","It decreases","It stays the same","It increases then falls to zero"],e:"Pure water has a higher water potential than the cells, so water enters by osmosis."},
    {q:"A cylinder changes from 2.50 g to 2.80 g. What is the percentage change in mass?",num:12,tol:0.05,unit:"%",e:"(2.80 − 2.50) ÷ 2.50 × 100 = +12%."},
    {q:"What does the point where the graph crosses 0% change show?",a:["The solution has the same water potential as the cells","The cells have died","All the sugar has been used","The potato has dried out"],e:"No net water movement means the water potentials are equal."},
    {q:"Why are cylinders blotted before reweighing?",a:["To remove surface solution that would add to the mass","To dry out the cells","To stop osmosis","To make them easier to cut"],e:"Liquid on the surface is not part of the tissue and would make the final mass too high."},
    {q:"A plant cell in a concentrated sugar solution becomes:",a:["plasmolysed","turgid","burst","larger"],e:"Water leaves the cell, and the cell membrane pulls away from the wall."},
    {q:"Why is percentage change used rather than change in mass?",a:["The starting masses are different","It is always positive","It is easier to measure","Balances read in percent"],e:"Percentage change allows a fair comparison between pieces of different starting mass."},
    {q:"What happens to a red blood cell in pure water?",a:["It swells and bursts","It shrinks","It becomes plasmolysed","Nothing"],e:"Animal cells have no cell wall, so water entering makes them burst."}
   ]},
  {title:"Lab challenge: osmosis",blurb:"Find the isotonic point of potato tissue from your own results.",prac:"osmosis",cards:[
    {h:"Your challenge",p:"Find the sucrose concentration that has the same water potential as potato cells.<ol><li>Choose the right apparatus.</li><li>Set up in the right order.</li><li>Weigh, soak, blot and reweigh six cylinders, then read your graph.</li></ol><p>Score <b>60 or more out of 100</b> to complete the Biology Lab.</p>"},
    {h:"Remember",p:"<ul><li>Blot each cylinder before reweighing.</li><li>Use percentage change in mass.</li><li>The isotonic point is where the line crosses 0%.</li></ul>"}
   ]}

// ---------- progress (kept on this device) ----------
const KEY="stemlight-lablink-v1";
let P={levels:{},acts:{},demo:false};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") P=Object.assign(P,s); }catch(e){}
function saveP(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
const lid=(lab,i)=>lab+"-"+i;
const stars=(lab,i)=>(P.levels[lid(lab,i)]||{}).stars||0;
const passed=(lab,i)=>stars(lab,i)>0;
const unlocked=(lab,i)=>P.demo||i===0||passed(lab,i-1);
const labDone=lab=>LABS[lab].levels.every((_,i)=>passed(lab,i));
function xp(){ let x=0; for(const k in P.levels) x+=(P.levels[k].stars||0)*50; for(const k in P.acts) if(P.acts[k]) x+=30; for(const k in (P.bank||{})) if(P.bank[k]>=1) x+=10; return x; }
const RANKS=[[0,"Lab Novice"],[200,"Lab Assistant"],[600,"Lab Technician"],[1200,"Lab Scientist"],[2000,"Lab Master"]];
function rank(x){ let r=RANKS[0],n=null; for(let i=0;i<RANKS.length;i++){ if(x>=RANKS[i][0]){ r=RANKS[i]; n=RANKS[i+1]||null; } } return {name:r[1],from:r[0],next:n}; }
function record(lab,i,s){ const k=lid(lab,i), prev=(P.levels[k]||{}).stars||0; if(s>prev){ P.levels[k]={stars:s}; saveP(); } return {prev,gain:Math.max(0,s-prev)*50}; }
function activityDone(id){ if(P.acts[id]) return 0; P.acts[id]=true; saveP(); hud(); toast("Activity complete · +30 XP"); return 30; }
function starHTML(n,max=3){ let s=""; for(let i=0;i<max;i++) s+=i<n?"★":`<span class="off">★</span>`; return `<span class="stars" aria-label="${n} of ${max} stars">${s}</span>`; }
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{ el.hidden=true; },2600); }
function hud(){ const x=xp(), r=rank(x); $("hudRank").textContent=r.name; $("hudXp").textContent=x+" XP"; const pct=r.next?((x-r.from)/(r.next[0]-r.from)*100):100; $("hudBar").style.width=Math.min(100,pct)+"%"; }

// ---------- shell ----------
const state={view:"home",lab:null,arg:null,tab:"levels",selA:null};
let current=null;   // running experiment or activity {tick(dt), destroy()}
function setAccent(lab){ const v=$("view"); if(!lab){ v.style.removeProperty("--accent"); v.style.removeProperty("--soft"); return; } v.style.setProperty("--accent",`var(${LABS[lab].accent})`); v.style.setProperty("--soft",`var(${LABS[lab].soft})`); }
function softColour(){ return css(LABS[state.lab].soft); }
function crumbs(){
  const c=$("crumbs"); c.innerHTML="";
  if(state.view==="home") return;
  const b=document.createElement("button"); b.textContent="All labs"; b.onclick=()=>go("home"); c.appendChild(b);
  const add=(t,f)=>{ const x=document.createElement("button"); x.textContent=t; x.onclick=f; c.appendChild(x); };
  if(state.view==="sub"||state.view==="qedit") add("Teacher dashboard",()=>{ ED=null; go("teacher"); });
  else if(state.view==="task") add("Class work",()=>go("classwork"));
  else if(state.lab&&state.view!=="lab") add(LABS[state.lab].name,()=>go("lab",state.lab));
  if(state.view==="chem"&&state.arg) add("Chemicals library",()=>go("chem","chemistry"));
  if(state.view==="req"||state.view==="tprof"||state.view==="lessons") add("Find a tutor",()=>go("tutors"));
  if(state.view==="req") add("My lessons",()=>go("lessons"));
  if(state.view==="group") add("Study groups",()=>go("groups"));
}
function stopCurrent(){ if(current&&current.destroy) current.destroy(); current=null; stopSound(); }
function go(view,lab,arg){
  stopCurrent();
  state.view=view; state.lab=lab||null; state.arg=arg;
  setAccent(view==="home"?null:state.lab); crumbs(); hud();

// ---------- quiz ----------
function sample(a,n){ return shuffle(a).slice(0,n); }
function buildQuiz(lab,lv){
  if(lv.quiz==="apparatus"){
    const list=APP[lab];
    return sample(list,7).map(a=>{ const wrong=sample(list.filter(b=>b.name!==a.name),3);
      return {q:`Which apparatus would you use to ${a.use}?`,opts:shuffle([{t:a.name,ok:true},...wrong.map(w=>({t:w.name,ok:false}))]),e:`${a.name}: ${a.what} ${a.tip}`}; });
  }
  return sample(lv.quiz,7).map(x=>x.num!=null?{q:x.q,num:x.num,tol:x.tol,unit:x.unit,e:x.e}:{q:x.q,opts:shuffle(x.a.map((t,j)=>({t,ok:j===0}))),e:x.e});
}
function quiz(lab,i,lv){
  const Q=buildQuiz(lab,lv), res=[]; let k=0;
  const need=Math.ceil(Q.length*0.7);
  function show(){
    const q=Q[k];
    $("lbody").innerHTML=`<div class="card quiz"><div class="qbar">${Q.map((_,j)=>`<i class="${j<res.length?(res[j]?"ok":"no"):j===k?"on":""}"></i>`).join("")}</div>
      <p class="tag2" style="margin:12px 0 4px">Question ${k+1} of ${Q.length} · pass mark ${need} of ${Q.length}</p><p class="q">${esc(q.q)}</p>
      ${q.opts?`<div class="opts">${q.opts.map((o,j)=>`<button data-j="${j}">${esc(o.t)}</button>`).join("")}</div>`
        :`<div class="row" style="align-items:end"><div class="field"><label for="qnum">Your answer${q.unit?" ("+esc(q.unit)+")":""}</label><input id="qnum" type="number" inputmode="decimal" step="any"></div><button class="primary" id="qsub">Check</button></div>`}
      <div id="qfb" style="margin-top:12px"></div></div>`;
    const answer=(ok)=>{ res.push(ok);
      $("lbody").querySelectorAll(".opts button,#qsub,#qnum").forEach(b=>b.disabled=true);
      $("qfb").innerHTML=`<div class="msg ${ok?"good":"warn"}"><b>${ok?"Correct.":"Not quite."}</b> ${esc(q.e)}</div><div class="row" style="margin-top:10px"><button class="primary grow" id="qnext">${k===Q.length-1?"See my result":"Next question"}</button></div>`;
      $("qnext").onclick=()=>{ k++; if(k<Q.length) show(); else done(); }; $("qnext").focus();
      $("lbody").querySelector(".qbar").children[k].className=ok?"ok":"no";
    };
    if(q.opts) $("lbody").querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{ const o=q.opts[+b.dataset.j];
      b.classList.add(o.ok?"right":"wrong"); if(!o.ok) $("lbody").querySelectorAll(".opts button").forEach((x,j)=>{ if(q.opts[j].ok) x.classList.add("right"); }); answer(o.ok); });
    else { const sub=()=>{ const v=parseFloat($("qnum").value); if(isNaN(v)){ $("qnum").focus(); return; } const ok=Math.abs(v-q.num)<=q.tol; if(!ok) $("qfb").dataset.a=q.num; answer(ok); if(!ok) $("qfb").querySelector(".msg").insertAdjacentHTML("beforeend",` <b>Answer: ${q.num} ${esc(q.unit||"")}</b>`); };
      $("qsub").onclick=sub; $("qnum").addEventListener("keydown",e=>{ if(e.key==="Enter") sub(); }); }
  }
  function done(){
    const score=res.filter(Boolean).length, ok=score>=need;
    const s=!ok?0:score===Q.length?3:score>=Q.length-1?2:1;
    const r=ok?record(lab,i,s):{gain:0}; hud();
    resultScreen(lab,i,{passed:ok,stars:s,gain:r.gain,line:`You scored ${score} out of ${Q.length}. ${ok?"":"You need "+need+" to pass."}`,retry:()=>quiz(lab,i,lv)});
  }
  show();
}

const PRAC_GUIDE={
 refraction:{h:"Method: refraction through a glass block",p:"<ol><li>Place the glass block in the middle of a sheet of plain paper and trace its outline with a sharp pencil.</li><li>Draw a normal at 90° to the long side, near its middle.</li><li>Connect the ray box to the power pack (12 V) and darken the room.</li><li>Shine a narrow ray at the point where the normal meets the block, at a measured angle of incidence i.</li><li>Mark the ray leaving the block with two small crosses, far apart.</li><li>Remove the block, join the points to draw the ray inside the glass, and measure the angle of refraction r from the normal.</li><li>Repeat for i = 10°, 20° … 70°. Plot sin i against sin r: the gradient is the refractive index n.</li></ol><p>In the virtual lab the protractor at the ray is magnified, so you read r directly.</p>"},
 rates:{h:"Method: rate of reaction of magnesium and acid",p:"<ol><li>Clamp the gas syringe and check the plunger moves freely and reads zero.</li><li>Measure 50 cm³ of hydrochloric acid into the conical flask.</li><li>Stand the flask in the water bath until it reaches the chosen temperature; check with the thermometer.</li><li>Clean a 5 cm strip of magnesium ribbon with sandpaper.</li><li>Connect the delivery tube from the flask's bung to the gas syringe.</li><li>Add the magnesium, replace the bung at once, and start the stopwatch.</li><li>Record the volume every 10 seconds until the plunger stops moving.</li><li>For the next run change <b>one</b> variable only, concentration or temperature, and keep everything else the same.</li></ol>"},
 osmosis:{h:"Method: osmosis in potato tissue",p:"<ol><li>Cut six potato cylinders with a cork borer and trim each to 3.0 cm on a white tile.</li><li>Label six boiling tubes 0.0 to 1.0 mol/dm³ and add 10 cm³ of each sucrose solution.</li><li>Blot each cylinder and weigh it on the top-pan balance.</li><li>Put one cylinder in each tube and leave them all for the same time (30 minutes).</li><li>Remove each with forceps, <b>blot it dry</b>, and reweigh it.</li><li>Calculate the % change in mass and plot it against concentration. The isotonic point is where the line crosses 0%.</li></ol>"}

const AREA={apparatus:"Choosing apparatus",setup:"Setting up",accuracy:"Accuracy of the result",readings:"Taking readings",method:"Experimental technique",data:"Amount of data"};

function recommend(id,S,r,total,err){
  const H=PHELP[id], lab=H.lab, strengths=[], issues=[], f=r.flags||{}, nm=a=>(NAMES[a]||a).toLowerCase();
  if(S.appWrong===0) strengths.push("Chose the right apparatus first time.");
  else issues.push({area:"apparatus",t:`Took ${S.appWrong+1} tries to choose the apparatus.${S.missed.size?" Missed at first: "+[...S.missed].map(nm).join(", ")+".":""}${S.extraSeen.size?" Picked but not needed: "+[...S.extraSeen].map(nm).join(", ")+".":""}`,refs:[{a:lab},{g:id}]});
  if(S.setupWrong===0) strengths.push("Set the experiment up in the correct order.");
  else issues.push({area:"setup",t:`${S.setupWrong} set-up step${S.setupWrong>1?"s were":" was"} tried out of order. First slip: “${S.misorder[0].tapped}” before “${S.misorder[0].expected}”.`,refs:[{g:id}]});
  if(Math.abs(err)<=r.tol) strengths.push(`Final result within ${r.tol}% of the true value.`);
  else issues.push({area:"accuracy",t:ACC_TEXT[id](err),refs:H.accuracy});
  if(id==="refraction"){ if(f.bad>0) issues.push({area:"readings",t:`${f.bad} angle reading${f.bad>1?"s were":" was"} more than 1° out. Read the protractor where the ray crosses it, counting from the normal.`,refs:H.reading}); else strengths.push("Every angle reading was accurate."); }
  if(id==="rates"){ if(!f.fair) issues.push({area:"method",t:"The runs changed more than one variable, so the effect of each cannot be separated. Change only concentration or only temperature between runs.",refs:H.fair}); else strengths.push("Ran a fair test, changing one variable."); if(f.early) issues.push({area:"method",t:"The last run was stopped before all the magnesium had reacted, so its total volume is too low.",refs:H.accuracy}); }
  if(id==="osmosis"){ if(!f.blotted) issues.push({area:"method",t:"The cylinders were not blotted before reweighing, so surface liquid made every final mass too high.",refs:H.blot}); else strengths.push("Blotted the cylinders before reweighing."); }
  if(r.n<r.minN) issues.push({area:"data",t:`Only ${r.n} readings were recorded; at least ${r.minN} are expected.`,refs:[{g:id}]});
  const band=total>=80?"Excellent":total>=60?"Good, with points to improve":"Needs more practice";
  const next=[]; if(issues.some(i=>i.area==="apparatus")) next.push(`Replay Level 1 of the ${LABS[lab].name} and its quiz.`);
  if(issues.length) next.push("Repeat this practical in Free practice after reading the tutorials above.");
  else next.push("Move on to the next level or a new practical.");
  return {band,strengths,issues,next};
}

function practical(lab,id,opts={}){

    <div class="stepper" id="stepper"></div><div id="stage" style="display:grid;gap:14px"></div>`;

  const helpbar=(items)=>`<div class="helpbar"><span>Stuck?</span>${items.map(x=>`<button class="tut" ${helpAttr(x.refs,x.t)}>${esc(x.t)}</button>`).join("")}</div>`;

  function stageApparatus(){
    const all=shuffle([...P_.need,...P_.distract]);
    $("stage").innerHTML=`<div class="card"><h2>Apparatus shelf <small>tap to put on your bench</small></h2><div class="shelf" id="shelf">${all.map(a=>`<button class="item" data-a="${a}" aria-pressed="${S.picked.has(a)}">${svgI(a)}<span>${NAMES[a]}</span></button>`).join("")}</div></div>
      <div class="card"><h2>Your bench <small id="cnt"></small></h2><div class="tray" id="tray"></div><div class="row" style="margin-top:10px"><button class="primary grow" id="chk">Check my apparatus</button></div><div class="msg" id="pmsg" style="margin-top:10px">${esc(P_.appIntro)}</div>
      ${helpbar([{t:"Apparatus guide",refs:[{a:H.lab}]},{t:"Read the method",refs:[{g:id}]}])}</div>`;
    const tray=()=>{ $("tray").innerHTML=S.picked.size?[...S.picked].map(a=>`<span class="chip">${svgI(a)}${NAMES[a]}</span>`).join(""):'<span class="none">Nothing on the bench yet.</span>'; $("cnt").textContent=S.picked.size+" items"; };
    tray();
    $("shelf").querySelectorAll(".item").forEach(b=>b.onclick=()=>{ const a=b.dataset.a; S.picked.has(a)?S.picked.delete(a):S.picked.add(a); b.setAttribute("aria-pressed",S.picked.has(a)); tray(); });
    $("chk").onclick=()=>{
      const missing=P_.need.filter(a=>!S.picked.has(a)), extra=[...S.picked].filter(a=>!P_.need.includes(a));
      if(!missing.length&&!extra.length){ say("All the apparatus you need is on the bench, and nothing extra. Move on to setting up.","good"); setTimeout(()=>{ S.stage=1; render(); },900); return; }
      S.appWrong++; missing.forEach(a=>S.missed.add(a)); extra.forEach(a=>S.extraSeen.add(a));
      const parts=[];
      if(extra.length) parts.push("This practical does not need: "+extra.map(a=>NAMES[a].toLowerCase()).join(", ")+". Put "+(extra.length>1?"them":"it")+" back.");
      if(missing.length) parts.push((missing.length===1?"One item is":missing.length+" items are")+" still missing. Hint: "+P_.hint[missing[0]]);
      if(S.appWrong>=2) parts.push("Open the apparatus guide below if you are unsure.");
      say(parts.join(" "),"warn");
    };
  }
  function stageSetup(){
    $("stage").innerHTML=`<div class="card"><h2>Set up the experiment <small>tap the steps in the right order</small></h2><div class="steps" id="steps"></div><div class="msg" id="pmsg" style="margin-top:10px">Follow the method. Tap the step you would do first.</div>
      ${helpbar([{t:"Read the method",refs:[{g:id}]}])}</div>`;
    const draw=()=>{ $("steps").innerHTML=S.order.map(i=>`<button data-s="${i}" class="${i<S.setupDone?"ok":""}" ${i<S.setupDone?"disabled":""}>${esc(P_.setup[i].t)}</button>`).join("");
      $("steps").querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>{ const i=+b.dataset.s;
        if(i===S.setupDone){ S.setupDone++; draw(); if(S.setupDone===P_.setup.length){ say("Set-up complete. Start the experiment.","good"); setTimeout(()=>{ S.stage=2; render(); },900); } else say("Correct. "+(P_.setup[i].ok||""),"good"); }
        else { S.setupWrong++; S.misorder.push({tapped:P_.setup[i].t,expected:P_.setup[S.setupDone].t}); say("Not yet. "+P_.setup[i].why+(S.setupWrong>=2?" The method guide below shows the full order.":""),"warn"); } }); };
    draw();
  }
  function stageRun(){
    $("stage").innerHTML=`${helpbar(H.run)}<div id="exp"></div>`;
    current=P_.mount($("exp"), (res)=>{ S.result=res; S.stage=3; render(); });
  }
  function stageReport(){
    const r=S.result, err=r.truth!=null?(r.value-r.truth)/r.truth*100:0;
    const acc=Math.max(0,40-Math.abs(err)*(r.strict||4)), appScore=Math.max(0,20-S.appWrong*5), setScore=Math.max(0,20-S.setupWrong*4), dataScore=Math.max(0,Math.min(20,r.dataScore!=null?r.dataScore:20));

    let top="", btns=`<button class="primary grow" id="again">Repeat this practical</button><button class="grow" id="back">Back to ${esc(LABS[lab].name)}</button>`;
    if(mode==="level"){ const g=opts.onScore(total), L=LABS[lab], nextI=opts.level+1<L.levels.length?opts.level+1:null;
      top=`<div class="result" style="margin:0 0 12px"><p class="bigstars">${starHTML(g.s)}</p>${g.s?`<p><b>Challenge passed.</b>${g.gain?` <span class="xpgain">+${g.gain} XP</span>`:""}</p>${labDone(lab)?`<div class="msg good">You have passed every level and earned the <b>${esc(L.name)} Master</b> badge.</div>`:""}`:`<p><b>Not passed yet.</b> You need 60 out of 100. Use the tutorials below and try again.</p>`}</div>`;

    if(mode==="assign"){ const A=opts.assign, pass=total>=A.pass;
      top=`<div class="msg ${pass?"good":"caution"}" style="margin-bottom:12px">System mark: <b>${total} / 100</b> (pass mark ${A.pass}). Your teacher will check it after you submit.</div>`;
      btns=`<button class="primary grow" id="submit">Submit to my teacher</button><button class="grow" id="again">Try again before submitting</button>`; }
    $("stage").innerHTML=`<div class="two"><div class="card report"><h2>Practical report</h2><p class="verdict">${total}<span style="font-size:1rem;color:var(--muted)"> / 100</span></p><p class="band">${esc(rec.band)}</p>
      ${line(r.label, r.value.toFixed(r.dp)+" "+r.unit, Math.abs(err)<=r.tol)}
      ${line("True value of this sample", r.truth.toFixed(r.dp)+" "+r.unit, true)}
      ${line("Difference", (err>=0?"+":"")+err.toFixed(1)+"%", Math.abs(err)<=r.tol)}
      ${line("Apparatus (20)", Math.round(appScore), S.appWrong===0)}
      ${line("Set-up (20)", Math.round(setScore), S.setupWrong===0)}
      ${line("Data quality (20)", Math.round(dataScore), dataScore>=20)}
      ${line("Accuracy (40)", Math.round(acc), Math.abs(err)<=r.tol)}
      ${line("Readings recorded", r.n, r.n>=r.minN)}
      ${HELPLOG.size?line("Tutorials opened", HELPLOG.size, true):""}
      </div><div class="card">${top}<h2>Feedback and next steps</h2><div class="msg ${Math.abs(err)<=r.tol?"good":"caution"}">${esc(r.feedback)}</div><div class="recs">${issuesHTML(rec)}</div>
      <div class="row" style="margin-top:12px" id="rbtns">${btns}</div><div id="submsg"></div></div></div>`;
    if($("again")) $("again").onclick=()=>mode==="level"?go("level",lab,opts.level):mode==="assign"?go("task",lab,opts.assign.id):go("prac",lab,id);
    if($("gnext")) $("gnext").onclick=()=>go("level",lab,opts.level+1);

    if($("submit")) $("submit").onclick=async()=>{ const b=$("submit"); b.disabled=true; b.textContent="Submitting…";

}

  qs.forEach(q=>{ q._ord=q.type==="mcq"&&q.opts?(q.shuffle?shuffle(q.opts.map((_,i)=>i)):q.opts.map((_,i)=>i)):null; });
  const assign=o.mode==="assign";
  function barClass(j){ const r=res[j]; if(r) return r.awarded>=qs[j].marks?"ok":r.awarded>0?"part":"no"; if(assign&&answers[j]!=="") return "ans"; return j===k?"on":""; }
  function render(){
    const q=qs[k], r=res[k];
    host.innerHTML=`<div class="card quiz qrun"><div class="qbar">${qs.map((_,j)=>`<i class="${barClass(j)}${j===k?" cur":""}"></i>`).join("")}</div>
      <p class="tag2" style="margin:12px 0 4px">Question ${k+1} of ${qs.length} · ${q.marks} mark${q.marks>1?"s":""}${topicName(q)?" · "+esc(topicName(q)):""}</p>
      ${q.ctx?`<div class="qctx" id="qctx"></div>`:""}<p class="q" id="qtext"></p><div id="qin"></div><div id="qfb" style="margin-top:12px"></div><div class="row" id="qnav" style="margin-top:12px"></div></div>`;
    $("qtext").textContent=q.q; if(q.ctx) $("qctx").textContent=q.ctx;
    const locked=!!r||busy;
    if(q.type==="mcq") $("qin").innerHTML=`<div class="opts">${q._ord.map((oi,j)=>`<button data-o="${oi}" class="${String(answers[k])===String(oi)?"picked":""}${r?(oi===q.ans?" right":String(answers[k])===String(oi)?" wrong":""):""}" ${locked?"disabled":""}><b>${String.fromCharCode(65+j)}.</b> <span></span></button>`).join("")}</div>`;
    else if(q.type==="num") $("qin").innerHTML=`<div class="row" style="align-items:end"><div class="field"><label for="qa">Your answer${q.unit?" ("+esc(q.unit)+")":""}</label><input id="qa" type="number" inputmode="decimal" step="any" ${locked?"disabled":""}></div></div>`;
    else $("qin").innerHTML=`<div class="field"><label for="qa">Your answer</label><textarea id="qa" rows="5" maxlength="3000" ${locked?"disabled":""} placeholder="Write your answer in full sentences."></textarea></div>`;
    if(q.type==="mcq") $("qin").querySelectorAll("[data-o]").forEach((b,j)=>{ b.querySelector("span").textContent=q.opts[+b.dataset.o]; b.onclick=()=>{ answers[k]=b.dataset.o; if(assign){ render(); } else check(); }; });
    else { $("qa").value=answers[k]; $("qa").oninput=e=>{ answers[k]=e.target.value; if(assign) host.querySelector(".qbar").children[k].className=barClass(k)+" cur"; }; }
    if(r) $("qfb").innerHTML=feedbackHTML(q,r,!assign);
    else if(hints.has(k)&&q.hint) $("qfb").innerHTML=`<div class="msg"><b>Hint:</b> <span id="hintx"></span></div>`, $("hintx").textContent=q.hint;
    const nav=[];
    if(assign){ nav.push(`<button class="grow" id="qprev" ${k?"":"disabled"}>Back</button>`); nav.push(k<qs.length-1?`<button class="grow primary" id="qnext">Next</button>`:`<button class="grow primary" id="qfin">Finish and submit</button>`); }
    else if(!r){ if(q.hint&&!hints.has(k)) nav.push(`<button class="grow" id="qhint">Show a hint</button>`); if(q.type!=="mcq") nav.push(`<button class="grow primary" id="qchk">${busy?"Marking…":"Check my answer"}</button>`); }
    else nav.push(`<button class="grow primary" id="qnext">${k<qs.length-1?"Next question":"See my results"}</button>`);
    $("qnav").innerHTML=nav.join("");
    if($("qprev")) $("qprev").onclick=()=>{ k--; render(); };
    if($("qnext")) $("qnext").onclick=()=>{ if(!assign&&k===qs.length-1) return results(); k++; render(); window.scrollTo({top:host.offsetTop-10}); };
    if($("qhint")) $("qhint").onclick=()=>{ hints.add(k); render(); };
    if($("qchk")) { $("qchk").disabled=busy; $("qchk").onclick=check; }
    if($("qfin")) $("qfin").onclick=finishAssign;
  }
  async function check(){
    const q=qs[k]; if(busy) return;
    if(q.type!=="mcq"&&!String(answers[k]).trim()){ $("qfb").innerHTML=`<div class="msg caution">Write an answer first.</div>`; return; }
    if(q.type==="short"){ busy=true; render(); const [m]=await markShort([{q,ans:answers[k]}],"quick"); busy=false; res[k]=m; }
    else res[k]=markAuto(q,answers[k]);
    if(hints.has(k)) res[k].hinted=true;
    if(o.onEach) o.onEach(q,res[k]);
    render();
  }
  async function finishAssign(){
    const unanswered=answers.filter(a=>a===""||a==null).length;
    if(unanswered&&!finishAssign.warned){ finishAssign.warned=true; $("qfb").innerHTML=`<div class="msg caution">${unanswered} question${unanswered>1?"s are":" is"} unanswered. Press Finish and submit again to submit anyway.</div>`; return; }
    host.innerHTML=`<div class="card"><h2>Marking your answers…</h2><p class="muted" style="margin:0">Multiple-choice and number answers are marked at once. Written answers are marked against the mark scheme${SAMPLE&&!SAMPLE_OFF?" by Claude; this can take up to a minute":""}.</p></div>`;
    const shortIdx=qs.map((q,i)=>q.type==="short"?i:-1).filter(i=>i>=0);
    const sm=await markShort(shortIdx.map(i=>({q:qs[i],ans:answers[i]})),"default");
    shortIdx.forEach((i,j)=>{ res[i]=sm[j]; });
    qs.forEach((q,i)=>{ if(!res[i]) res[i]=markAuto(q,answers[i]); });
    o.onFinish(res.map((r,i)=>({qid:qs[i].id,ans:String(answers[i]).slice(0,3000),awarded:r.awarded,max:qs[i].marks,feedback:r.feedback,missing:r.missing||[],by:r.by})));
  }
  function results(){
    const raw=res.reduce((t,r)=>t+r.awarded,0), max=qs.reduce((t,q)=>t+q.marks,0), pct=Math.round(raw/max*100);
    const byT={}; qs.forEach((q,i)=>{ const t=topicName(q)||"General"; (byT[t]=byT[t]||{a:0,m:0,refs:[]}); byT[t].a+=res[i].awarded; byT[t].m+=q.marks; if(res[i].awarded<q.marks) byT[t].refs.push(...(q.refs||[])); });
    const weak=Object.entries(byT).filter(([,v])=>v.a/v.m<0.6);
    if(o.onDone) o.onDone(res,qs);
    host.innerHTML=`<div class="card result"><p class="verdict" style="text-align:center">${pct}%</p><h2 style="justify-content:center">${pct>=80?"Excellent work":pct>=60?"Good, with points to improve":"Keep practising"}</h2><p>${raw} of ${max} marks.</p></div>
      <div class="card"><h2>By topic</h2>${Object.entries(byT).map(([t,v])=>`<div class="line2"><span>${esc(t)}</span><span class="lbar"><i style="width:${Math.round(v.a/v.m*100)}%"></i></span><b>${Math.round(v.a/v.m*100)}%</b></div>`).join("")}
      ${weak.length?`<div class="iss-list" style="margin-top:12px"><b>Revise these topics</b>${weak.map(([t,v])=>{ const refs=uniqRefs(v.refs); return `<div class="iss"><span class="area">${esc(t)}</span><p>You scored ${Math.round(v.a/v.m*100)}% on ${esc(t.toLowerCase())}. Read the tutorials, then practise this topic again.</p><div class="row">${refs.map(r=>`<button class="tut" ${helpAttr([r],refLabel(r))}>${esc(refLabel(r))}</button>`).join("")}</div></div>`; }).join("")}</div>`:`<div class="msg good" style="margin-top:12px">No weak topics in this set. Try a harder mix or a full practical.</div>`}
      <div class="row" style="margin-top:12px">${o.again?`<button class="primary grow" id="qagain">Practise again</button>`:""}<button class="grow" id="qback">${esc(o.backLabel||"Back")}</button></div></div>`;
    if($("qagain")) $("qagain").onclick=o.again; $("qback").onclick=o.back;
    window.scrollTo({top:0});
  }
  render();
}
const uniqRefs=refs=>{ const s=new Set(), out=[]; refs.forEach(r=>{ const k=JSON.stringify(r); if(!s.has(k)){ s.add(k); out.push(r); } }); return out.slice(0,4); };
function feedbackHTML(q,r,showModel){
  const full=r.awarded>=q.marks, part=r.awarded>0&&!full;
  return `<div class="msg ${r.by==="pending"?"caution":full?"good":part?"caution":"warn"}"><b>${r.by==="pending"?"Waiting for your teacher.":full?"Correct.":part?"Partly correct.":"Not quite."}</b> ${r.awarded} / ${q.marks} mark${q.marks>1?"s":""}. ${esc(r.feedback||"")}</div>
    ${!full&&r.missing&&r.missing.length?`<div class="qmiss"><b>Points to include</b><ul>${r.missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}
    ${showModel&&q.model?`<div class="qmodel"><b>Worked answer</b><p>${esc(q.model)}</p></div>`:""}
    ${showModel&&q.refs&&q.refs.length?`<div class="row" style="margin-top:8px">${q.refs.map(rf=>`<button class="tut" ${helpAttr([rf],refLabel(rf))}>${esc(refLabel(rf))}</button>`).join("")}</div>`:""}
    <p class="tag2" style="margin:8px 0 0">${r.by==="ai"?"Marked by Claude against the mark scheme":r.by==="auto"&&q.type==="short"?"Marked by keyword check against the mark scheme":r.by==="pending"?"No mark scheme: teacher marking needed":"Marked automatically"}${r.hinted?" · hint used":""}</p>`;
}

function bankView(lab,arg){
  const B=BANK[lab], st=P.bank||{}; let qs=[], title="";
  if(arg.kind==="topic"){ qs=shuffle(B.filter(q=>q.topic===arg.key)); title=BANK_TOPICS[lab][arg.key]; }
  else if(arg.kind==="wrong"){ qs=shuffle(B.filter(q=>st[q.id]!=null&&st[q.id]<1)).slice(0,10); title="Questions to retry"; }
  else if(arg.kind==="set"){ const s=QSETS[arg.key]; if(s){ qs=s.questions.map((x,i)=>normSetQ(x,i,lab)); title=s.title||"Question set"; } }

}
