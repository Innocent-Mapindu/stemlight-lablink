  const mk=(type)=>{ const c=TYPES[type].c; return type==="rbc"?svgEl("ellipse",{rx:6.5,ry:4.5,fill:c,stroke:"#7a1018","stroke-width":.7},molG):type==="protein"?svgEl("path",{d:"M-6 -2 C-4 -7, 4 -7, 6 -2 C8 3, 3 7, 0 5 C-4 8, -8 4, -6 -2 Z",fill:c,stroke:"#1f5a36","stroke-width":.7},molG):type==="glucose"?svgEl("path",{d:"M-4 -2.3L0 -4.6L4 -2.3L4 2.3L0 4.6L-4 2.3Z",fill:c,stroke:"#a8892a","stroke-width":.7},molG):type==="salt"?svgEl("rect",{x:-2.6,y:-2.6,width:5.2,height:5.2,fill:c},molG):svgEl("circle",{r:type==="urea"?3.4:2.8,fill:c,stroke:type==="urea"?"#4b2c6a":"none","stroke-width":.6},molG); };
  const parts=[];
  const urineTally=[];
  const labG=svgEl("g",{"pointer-events":"none"},svg);
  const L=[["glom","Glomerulus",20,190,160,150],["bowman","Bowman's capsule",20,240,150,196],["pct","First coiled tubule",250,40,300,170],["loop","Loop of Henle",230,420,404,420],["dct","Second coiled tubule",470,140,536,196],["duct","Collecting duct",780,300,668,300],["capil","Blood capillaries",230,600,392,560]];
  const labs=L.map(([id,t,x,y,ax,ay])=>{ const grp=svgEl("g",{},labG); const anchor=x>=700?"end":"start"; const w=t.length*8.2, lx=anchor==="end"?x-w-4:(ax>x+w?x+w+4:x+w/2);
    const ln=svgEl("line",{x1:lx,y1:ax>x+w||anchor==="end"?y-5:y+5,x2:ax,y2:ay,stroke:"#3d4846","stroke-width":1.2},grp); svgEl("circle",{cx:ax,cy:ay,r:2.2,fill:"#3d4846"},grp);
    const tx=svgEl("text",{x,y,"text-anchor":anchor,"font-size":16,class:"lbl"},grp); tx.textContent=t; return {id,grp,tx,ln,t,x,y,anchor}; });
  const ctx=svgEl("g",{"pointer-events":"none","font-size":13,"font-family":"IBM Plex Mono, monospace",fill:"#5a6966"},svg); ctx.setAttribute("paint-order","stroke"); ctx.setAttribute("stroke","#fff"); ctx.setAttribute("stroke-width","3");
  [["blood in (renal artery)",8,82,"start"],["blood out (renal vein)",790,30,"end"],["urine to the pelvis",650,612,"end"],["cortex",790,320,"end"],["medulla",790,348,"end"]].forEach(([t,x,y,a])=>{ svgEl("text",{x,y,"text-anchor":a},ctx).textContent=t; });
  NP={svg,TR,BR,VR,mk,parts,urineTally,labs,ctx,stats:{filt:0,reab:{glucose:0,water:0,salt:0,urea:0}}};
  for(let i=0;i<150;i++) spawnBlood(Math.random()*BR.L);
  for(let k=0;k<600;k++) tickNeph(0.05);
  return svg; }
function spawnBlood(s){ const N=S.neph, r=Math.random(); const gw=N.diabetes?0.2:0.08;
  const type=r<0.16?"rbc":r<0.22?"protein":r<0.22+gw?"glucose":r<0.32+gw?"urea":r<0.88?"water":"salt";
  NP.parts.push({type,route:"B",s:s||0,el:NP.mk(type),o:(Math.random()-0.5)*6}); }
function tickNeph(dt){
  const N=S.neph, Z=NP, adh=N.adh;
  // fraction of each substance reabsorbed in each part of the tubule, turned into a rate using the time spent there
  const m=Z.TR.marks, tz={pct:(m.desc-m.pct)/110,desc:(m.asc-m.desc)/110,asc:(m.dct-m.asc)/110,dct:(m.cd-m.dct)/110,cd:(m.end-m.cd)/110};
  const FR={glucose:{pct:N.diabetes?0.45:0.999},water:{pct:0.5,desc:0.25,cd:lerp(0.05,0.8,adh)},salt:{pct:0.6,asc:0.4,dct:0.3},urea:{pct:0.15}};
  const RP={}; for(const k in FR){ RP[k]={}; for(const z in FR[k]) RP[k][z]=-Math.log(1-FR[k][z])/tz[z]; }
  const zoneOf=s=>{ const m=Z.TR.marks; return s<m.pct?"cap":s<m.desc?"pct":s<m.asc?"desc":s<m.dct?"asc":s<m.cd?"dct":"cd"; };
  for(let i=Z.parts.length-1;i>=0;i--){ const p=Z.parts[i];
    if(p.move){ p.move.t+=dt/0.45; const k=clamp(p.move.t,0,1); p.x=lerp(p.move.x0,p.move.x1,k); p.y=lerp(p.move.y0,p.move.y1,k); if(k>=1){ p.route=p.move.to; p.s=p.move.s; p.move=null; } }
    else if(p.route==="B"){ p.s+=dt*130; const R=Z.BR;
      // ultrafiltration: small molecules are squeezed out of the glomerulus
      if(p.s>R.marks.g0&&p.s<R.marks.g1&&(p.type!=="rbc"&&(p.type!=="protein"||N.damage))&&Math.random()<dt*3.5){ const a=R.at(p.s), b=Z.TR.at(4+Math.random()*10); p.move={x0:a.x,y0:a.y,x1:b.x,y1:b.y,t:0,to:"T",s:6}; Z.stats.filt++; }
      if(p.s>=R.L){ p.el.remove(); Z.parts.splice(i,1); spawnBlood(0); continue; } const a=R.at(p.s); p.x=a.x+Math.sin(p.s*0.07)*p.o*0.4; p.y=a.y+p.o*0.5; }
    else if(p.route==="V"){ p.s+=dt*105; if(p.s>=Z.VR.L){ p.el.remove(); Z.parts.splice(i,1); spawnBlood(0); continue; } const a=Z.VR.at(p.s); p.x=a.x; p.y=a.y; }
    else { // in the tubule
      p.s+=dt*110; const zn=zoneOf(p.s), pr=(RP[p.type]||{})[zn]||0;
      if(pr&&Math.random()<dt*pr){ const a=Z.TR.at(p.s); let to="B", s2, b;
        if(zn==="cd"){ to="V"; s2=Z.VR.nearest(a.x+36,a.y); b=Z.VR.at(s2); } else { s2=Z.BR.nearest(a.x,a.y); s2=Math.max(s2,Z.BR.marks.g1+10); b=Z.BR.at(s2); }
        p.move={x0:a.x,y0:a.y,x1:b.x,y1:b.y,t:0,to,s:s2}; Z.stats.reab[p.type]=(Z.stats.reab[p.type]||0)+1; }
      if(p.s>=Z.TR.L){ Z.urineTally.push(p.type); if(Z.urineTally.length>60) Z.urineTally.shift(); p.el.remove(); Z.parts.splice(i,1); spawnBlood(0); continue; }
      const a=Z.TR.at(p.s); p.x=a.x+p.o*0.6; p.y=a.y+p.o*0.4; }
    p.el.setAttribute("transform",`translate(${f1(p.x)} ${f1(p.y)})`); }
  if(S.frameN%8===0&&$("nu-water")){ const T=Z.urineTally, n=T.length||1; ["water","urea","salt","glucose","protein"].forEach(k=>{ const c=T.filter(x=>x===k).length; $("nu-"+k).style.width=Math.round(c/n*100)+"%"; });
    $("nglu").textContent=T.includes("glucose")?"Glucose is in the urine!":"No glucose in the urine"; $("nglu").className=T.includes("glucose")?"cl":"op"; $("npro").textContent=T.includes("protein")?"Protein is in the urine!":"No protein in the urine"; $("npro").className=T.includes("protein")?"cl":"op"; } }
function nephSide(){
  const N=S.neph;
  $("side").innerHTML=`<div class="card"><h2>How a nephron makes urine</h2><ol style="margin:0;padding-left:20px;font-size:.9rem"><li><b>Ultrafiltration:</b> high pressure in the glomerulus squeezes water, glucose, salts and urea into Bowman's capsule. Blood cells and proteins are too big and stay in the blood.</li><li><b>Selective reabsorption:</b> in the first coiled tubule all the glucose, and much of the water and salts, go back into the blood.</li><li><b>The loop of Henle</b> makes the medulla salty, which helps water leave the collecting duct.</li><li><b>Water reabsorption:</b> ADH controls how much water the collecting duct returns to the blood. What is left is urine: urea, excess water and salts.</li></ol>
    <div class="ctl"><label for="nadh">ADH in the blood <span id="nadhv"></span></label><input type="range" id="nadh" min="0" max="1" step="0.01" value="${N.adh}"></div>
    <div class="row" style="margin-top:10px"><button class="primary" id="play"></button></div>
    <div class="ctl"><label for="rate">Speed <span id="ratev"></span></label><input type="range" id="rate" min="0" max="2" step="1"></div></div>
   <div class="card"><h2>What is in the urine</h2><div class="nb">${["water","urea","salt","glucose","protein"].map(k=>`<span>${TYPES[k].n}</span><span class="nbar"><i id="nu-${k}" style="background:${TYPES[k].c}"></i></span>`).join("")}</div><div class="vstate"><span id="nglu"></span><span></span><span id="npro"></span></div></div>
   <div class="card"><h2>What if…</h2><div class="chips"><label class="chip"><input type="checkbox" id="ndia" ${N.diabetes?"checked":""}>Diabetes: very high blood glucose</label><label class="chip"><input type="checkbox" id="ndam" ${N.damage?"checked":""}>Damaged glomerulus</label><label class="chip"><input type="checkbox" id="lbl" ${S.labels?"checked":""}>Labels</label></div><div id="nmsg"></div></div>
   <div class="card info" id="info"><h2>Tap any part</h2><div class="chips">${["glom","bowman","pct","loop","dct","duct","capil"].map(k=>`<button class="chip" data-pick="${k}">${esc(PARTS[k].n)}</button>`).join("")}</div></div>`;
  commonControls();
  const setA=()=>{ N.adh=+$("nadh").value; $("nadhv").textContent=N.adh>0.66?"high: little, concentrated urine":N.adh<0.33?"low: lots of dilute urine":"normal"; }; $("nadh").oninput=setA; setA();
  const msg=()=>{ $("nmsg").innerHTML=(N.diabetes?`<div class="msg warn">In untreated diabetes there is so much glucose in the blood that the tubule cannot reabsorb it all, so glucose appears in the urine. Testing urine with Benedict's solution or a test strip is one sign of diabetes.</div>`:"")+(N.damage?`<div class="msg warn">If the glomerulus is damaged (for example by high blood pressure or infection), proteins leak into the filtrate and appear in the urine. When kidneys fail, a dialysis machine or a kidney transplant is needed.</div>`:""); };
  $("ndia").onchange=e=>{ N.diabetes=e.target.checked; NP.urineTally.length=0; msg(); }; $("ndam").onchange=e=>{ N.damage=e.target.checked; NP.urineTally.length=0; msg(); }; msg();
  $("side").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>showInfo(b.dataset.pick)); }

// ---------- shared ----------
function commonControls(){
  const rates=[0.25,0.5,1], rn=["Very slow","Slow motion","Normal"];
  if(!rates.includes(S.rate)) S.rate=1;
  $("rate").value=rates.indexOf(S.rate); const setRate=()=>{ S.rate=rates[+$("rate").value]; $("ratev").textContent=rn[+$("rate").value]; }; $("rate").oninput=setRate; setRate();
  const playLbl=()=>$("play").textContent=S.playing?"Pause":"Play"; $("play").onclick=()=>{ S.playing=!S.playing; playLbl(); }; playLbl();
  if($("lbl")) $("lbl").onchange=e=>{ S.labels=e.target.checked; applyLabels(); }; }
function cur(){ return S.view==="uri"?UR:S.view==="kid"?KD:NP; }
function applyLabels(){ cur().labs.forEach(l=>l.grp.setAttribute("visibility",S.labels?"visible":"hidden")); }
function dimTo(id){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.toggle("dim",e.dataset.part!==id)); }
function undim(){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.remove("dim")); }
function showInfo(id){ const p=PARTS[id]; if(!p||!$("info")) return; S.selected=id; dimTo(id);
  $("info").innerHTML=`<h3>${esc(p.n)}</h3><p>${esc(p.t)}</p><div class="row" style="margin-top:6px"><button id="clr">Show everything</button>${id==="kidney"?`<button class="primary" id="gok">See inside a kidney</button>`:""}${id==="nephron"?`<button class="primary" id="gon2">Look inside a nephron</button>`:""}</div>`;
  $("clr").onclick=()=>{ S.selected=null; undim(); setView(S.view); }; if($("gok")) $("gok").onclick=()=>setView("kid"); if($("gon2")) $("gon2").onclick=()=>setView("neph"); }
const QZ=[{tap:"kidney",q:"Tap a kidney."},{tap:"ureter",q:"Tap a ureter."},{tap:"bladder",q:"Tap the bladder."},{tap:"urethra",q:"Tap the urethra."},
 {q:"Where is urea made?",o:["In the kidneys","In the liver","In the bladder","In the lungs"],a:1},
 {q:"Which substance is filtered out of the blood but then completely reabsorbed in a healthy kidney?",o:["Urea","Glucose","Protein","Red blood cells"],a:1},
 {q:"On a hot day you sweat a lot. What happens?",o:["Less ADH is released and you make lots of pale urine","More ADH is released and you make a little concentrated urine","ADH stops completely","Urea stops being made"],a:1},
 {q:"Why are proteins not found in the urine of a healthy person?",o:["They are digested in the bladder","They are too big to be filtered out of the glomerulus","They are all reabsorbed in the loop of Henle","They turn into urea"],a:1}];
function startQuiz(){ S.quiz={i:0,score:0}; drawQuiz(); }
function drawQuiz(){ const Q=S.quiz, el=$("quiz"); if(!el) return;
  if(Q.i>=QZ.length){ el.innerHTML=`<h2>Test complete</h2><p class="phase" style="font-size:1.6rem;margin:4px 0">${Q.score} / ${QZ.length}</p><p>${Q.score===QZ.length?"Excellent: you know how the kidneys work.":"Tap the parts you missed to read about them, then try again."}</p><button class="primary" id="qagain">Try again</button>`; $("qagain").onclick=startQuiz;
    try{ parent.postMessage({type:"lablink-3d-result",prac:"excretion",score:Math.round(Q.score/QZ.length*100)},"*"); }catch(e){} Q.done=true; return; }
  const q=QZ[Q.i]; el.innerHTML=`<h2>Question ${Q.i+1} of ${QZ.length}</h2><div class="q"><p><b>${esc(q.q)}</b></p>${q.tap?`<p class="note">Tap it in the picture. Labels are hidden during the test.</p>`:`<div class="opts">${q.o.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join("")}</div>`}</div><div id="qfb"></div>`;
  if(q.tap){ S.labels=false; applyLabels(); }
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o===q.a,b,el.querySelector(`[data-o="${q.a}"]`))); }
function answer(ok,btn,right){ const Q=S.quiz; if(Q.lock) return; Q.lock=true; if(ok) Q.score++; if(btn){ btn.classList.add(ok?"right":"wrong"); if(right) right.classList.add("right"); }
  const q=QZ[Q.i]; $("qfb").innerHTML=`<div class="msg ${ok?"":"warn"}">${ok?"Correct.":q.tap?`Not quite: look at the highlighted part, the ${esc(PARTS[q.tap].n.toLowerCase())}.`:"Not quite: the right answer is highlighted."}</div><button class="primary" id="qnext" style="margin-top:8px">${Q.i+1<QZ.length?"Next question":"See your score"}</button>`;
  if(q.tap&&!ok) dimTo(q.tap);
  $("qnext").onclick=()=>{ Q.lock=false; Q.i++; undim(); if(Q.i>=QZ.length){ S.labels=true; applyLabels(); } drawQuiz(); }; }
const LEG={uri:`<span><i style="background:#e0505a"></i>Blood with urea</span><span><i style="background:#5b6ac0"></i>Filtered blood</span><span><i style="background:#8e5bb5"></i>Urea from the liver</span><span><i style="background:#5f9a35"></i>ADH (hormone)</span><span><i style="background:#d9a630"></i>Urine</span>`,
 kid:`<span><i style="background:#c22a33"></i>Renal artery</span><span><i style="background:#3c5ab0"></i>Renal vein</span><span><i style="background:#fff59a;border:1px solid #c9a020"></i>One nephron</span><span><i style="background:#d9a630"></i>Urine</span>`,
 neph:Object.entries(TYPES).map(([k,t])=>`<span><i style="background:${t.c}"></i>${t.n}</span>`).join("")};
const BELOW={neph:`<h2>Blood plasma, filtrate and urine compared</h2><div class="tbl"><table><tr><th>Substance</th><th>In blood plasma</th><th>In the filtrate</th><th>In urine</th></tr><tr><td>Proteins</td><td>Yes</td><td>No (too big)</td><td>No</td></tr><tr><td>Glucose</td><td>Yes</td><td>Yes</td><td>No (all reabsorbed)</td></tr><tr><td>Urea</td><td>A little</td><td>A little</td><td>Much more concentrated</td></tr><tr><td>Salts</td><td>Yes</td><td>Yes</td><td>Yes (the excess)</td></tr><tr><td>Water</td><td>Yes</td><td>Yes</td><td>Yes (amount depends on ADH)</td></tr></table></div>`,
 uri:`<h2>Kidney failure</h2><p style="margin:0;font-size:.9rem">If both kidneys fail, urea and excess water and salts build up in the blood. Patients can be treated with <b>dialysis</b>: blood flows through a machine on one side of a partially permeable membrane, and urea and excess salts diffuse out into dialysis fluid, which contains the right amounts of glucose and salts so these are not lost. Dialysis takes several hours, three times a week. A <b>kidney transplant</b> from a donor is a long-term cure, but the patient must take drugs so that the new kidney is not rejected.</p>`};
function setView(v){
  S.view=v; document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
  const st=$("stage"); st.innerHTML=""; S.selected=null; S.quiz=null; $("legend").innerHTML=LEG[v]; $("below").hidden=!BELOW[v]; $("below").innerHTML=BELOW[v]||"";
  if(v==="uri"){ if(!UR) buildUri(); st.appendChild(UR.svg); uriSide(); }
  else if(v==="kid"){ if(!KD) buildKid(); st.appendChild(KD.svg); kidSide(); }
  else { if(!NP) buildNeph(); st.appendChild(NP.svg); nephSide(); }
  undim(); applyLabels(); fitLabels(); }
function fitLabels(){ const narrow=innerWidth<600;
  [UR,KD,NP].forEach(V=>{ if(!V) return; V.labs.forEach(l=>{ if(!l.tx) return; const words=l.t.split(" "); l.tx.textContent=""; l.tx.setAttribute("font-size",narrow?22:16);
    if(narrow&&words.length>1){ const cut=Math.ceil(words.length/2); [words.slice(0,cut).join(" "),words.slice(cut).join(" ")].forEach((w,i)=>{ const sp=document.createElementNS(NS,"tspan"); sp.setAttribute("x",l.x); sp.setAttribute("y",l.y+(i?12:-10)); sp.textContent=w; l.tx.appendChild(sp); }); }
    else l.tx.textContent=l.t; }); V.ctx.setAttribute("font-size",narrow?17:13); }); }
addEventListener("resize",fitLabels);
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("stage").addEventListener("click",e=>{ const p=e.target.closest(".part"); if(!p) return; const id=p.dataset.part;
  if(S.view==="uri"&&S.quiz&&!S.quiz.done&&QZ[S.quiz.i]&&QZ[S.quiz.i].tap&&!S.quiz.lock){ answer(id===QZ[S.quiz.i].tap); return; } showInfo(id); });
$("stage").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("part")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
let last=performance.now();
function frame(now){
  const dtReal=Math.min(0.05,(now-last)/1000); last=now;
  const dt=S.playing?dtReal*S.rate:0; S.simTime+=dt;
  if(S.view==="uri"&&UR) tickUri(dt); else if(S.view==="kid"&&KD) tickKid(dt); else if(S.view==="neph"&&NP) tickNeph(dt);
  S.frameN++; requestAnimationFrame(frame); }
setView("uri");
if(RM) S.playing=false;
requestAnimationFrame(frame);
window.__excr={S,get UR(){return UR;},get KD(){return KD;},get NP(){return NP;},setView};
})();
