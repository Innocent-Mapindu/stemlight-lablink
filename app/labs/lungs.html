    const a=P[lo-1],b=P[lo],t=(s-cum[lo-1])/((cum[lo]-cum[lo-1])||1); return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}; }}; }

let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };

// ---------- shared state ----------
const S={view:"breath",playing:!RM,rate:0.5,bpm:12,t:0,labels:true,mode:"rest",deepReq:false,stepTo:null,simTime:0,hist:[],quiz:null,selected:null,

const PH=[{k:"IN",name:"Breathing in",a:0,b:0.4},{k:"OUT",name:"Breathing out",a:0.4,b:1}];
const phaseOf=t=>t<0.4?PH[0]:PH[1];

const PARTS={
 larynx:{n:"Larynx (voice box)",t:"The top of the trachea. It contains the vocal cords. Air passes through it on the way in and out of the lungs."},
 trachea:{n:"Trachea (windpipe)",t:"Carries air from the throat to the lungs. C-shaped rings of cartilage hold it open so it never collapses, even when the pressure inside falls. It is lined with cells that have cilia and cells that make mucus."},
 bronchus:{n:"Bronchi",t:"The trachea divides into two bronchi, one going into each lung. Like the trachea, they are held open by rings of cartilage."},
 bronchiole:{n:"Bronchioles",t:"The bronchi branch again and again into thousands of narrower tubes called bronchioles. They have no cartilage, but they do have smooth muscle: in an asthma attack this muscle tightens and makes breathing difficult."},
 lung:{n:"Lungs",t:"Spongy organs made of millions of tiny air sacs (alveoli) and the blood capillaries around them. They are not muscles: they expand and shrink only because the chest around them changes size."},
 alveoli:{n:"Alveoli",t:"Tiny air sacs at the ends of the bronchioles, covered in blood capillaries. This is where oxygen diffuses into the blood and carbon dioxide diffuses out. Open the Gas exchange tab to watch it happen."},
 pleura:{n:"Pleural membranes",t:"Two thin membranes: one covers each lung, the other lines the inside of the chest. A thin layer of fluid between them lets the lungs slide smoothly, and holds the lungs against the chest wall so they follow it outwards. If the chest wall is punctured, air gets in between the membranes and the lung collapses."},
 rib:{n:"Ribs",t:"Bones that protect the heart and lungs. When you breathe in, the external intercostal muscles pull the ribs upwards and outwards, which makes the chest bigger."},
 intercostal:{n:"Intercostal muscles",t:"Muscles between the ribs. The external intercostal muscles contract when you breathe in, raising the ribs. The internal intercostal muscles contract when you breathe out forcefully, for example during exercise or coughing, pulling the ribs down and in."},
 diaphragm:{n:"Diaphragm",t:"A dome-shaped sheet of muscle under the lungs. When it contracts it flattens and moves down, making the chest taller. When it relaxes, it returns to its dome shape."},
 heart:{n:"Heart",t:"Sits between the two lungs. The pulmonary arteries carry deoxygenated blood from it to the lungs, and the pulmonary veins bring oxygenated blood back."},
 abdomen:{n:"Liver and stomach",t:"Organs of the abdomen, below the diaphragm. When the diaphragm contracts it pushes them down; that is why your belly moves out when you breathe in deeply."},
 alv:{n:"Alveolus",t:"A tiny air sac. Its wall is only one cell thick and it is lined with a thin film of moisture, so gases dissolve and diffuse across very quickly."},
 alvwall:{n:"Alveolus wall",t:"Made of a single layer of very thin, flattened cells. Together with the capillary wall, the gases have to cross less than a thousandth of a millimetre."},
 lining:{n:"Moist lining",t:"Oxygen dissolves in this thin layer of water before it diffuses across the wall into the blood."},
 cap:{n:"Capillary",t:"The narrowest blood vessel. Its wall is one cell thick and it is so narrow that red blood cells pass in single file, pressed close to the wall: this shortens the distance oxygen has to diffuse. Blood keeps flowing, carrying oxygen away, so the concentration gradient is kept steep."},
 rbc:{n:"Red blood cells",t:"Contain haemoglobin, which combines with oxygen to form oxyhaemoglobin. Arriving from the body they are low in oxygen (shown blue); they leave full of oxygen (shown red)."},

const BW=y=>95+97*Math.sin(clamp((y-150)/330,0,1)*Math.PI/2);

function geom(gR,gD){

// heart borders (offset from the midline) for a given height
const hr=(y,yc)=>y<318?0:30+22*Math.sin(Math.PI*clamp((y-318)/(yc-300),0,1));

  svgEl("path",{d:"M410 330 C408 232, 420 206, 444 206 C468 206, 474 230, 470 300",stroke:"#c7333b","stroke-width":15,fill:"none"},vess);

  [-1,1].forEach(s=>{ lung[s]=svgEl("path",{fill:"url(#lungG)",stroke:"#5d89b8","stroke-width":1.2},lg); lungTex[s]=svgEl("path",{fill:"url(#alvP)","pointer-events":"none"},lg); fiss[s]=svgEl("path",{fill:"none",stroke:"#b5646c","stroke-width":1.6,opacity:.8},lg); });
  const pneumoTxt=svgEl("text",{x:238,y:430,"text-anchor":"middle","font-size":13,class:"lbl small",visibility:"hidden",transform:"rotate(-80 238 430)"},g); pneumoTxt.textContent="air in the pleural cavity";

  // particles in the air

function tickAir(dt){

    const L=smoke?20:28, bx=c.x, by=262, tx=bx+Math.sin(a)*L, ty=by-Math.cos(a)*L*(smoke?0.6:1), qx=bx+Math.sin(a*0.4)*L*0.5, qy=by-L*0.55; c.el.setAttribute("d",`M${f1(bx)} ${by} Q${f1(qx)} ${f1(qy)} ${f1(tx)} ${f1(ty)}`); c.el.setAttribute("stroke",smoke?"#8a6a4a":"#b5767a"); });

function airSide(){

    <div class="row" style="margin-top:10px"><button class="primary" id="play"></button><button id="cough">Cough</button></div>
    <div class="ctl"><label for="rate">Speed <span id="ratev"></span></label><input type="range" id="rate" min="0" max="2" step="1"></div></div>
   <div class="card"><h2>Choose what moves</h2><div class="chips">${[["cilia","Cilia beating"],["particles","Dust, pollen and bacteria"]].map(([k,t])=>`<label class="chip"><input type="checkbox" data-a="${k}" ${S.air[k]?"checked":""}>${t}</label>`).join("")}<label class="chip"><input type="checkbox" id="lbl" ${S.labels?"checked":""}>Labels</label></div>

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
