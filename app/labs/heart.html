 <div><div class="stage" id="stage"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const OXY=[212,35,47], DEOXY=[47,78,160];
const mixc=t=>`rgb(${OXY.map((v,i)=>Math.round(lerp(DEOXY[i],v,t))).join(",")})`;
const RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- smooth routes (Catmull-Rom through waypoints) ----------
function mkRoute(pts,opts){
  const W=pts.map(p=>({x:p[0],y:p[1],z:p[2],m:p[3]||null}));
  const P=[]; const marks={};
  for(let i=0;i<W.length-1;i++){
    const p0=W[Math.max(0,i-1)],p1=W[i],p2=W[i+1],p3=W[Math.min(W.length-1,i+2)];
    if(p1.m) marks[p1.m]=P.length;
    for(let k=0;k<10;k++){ const t=k/10,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      P.push({x:f(p0.x,p1.x,p2.x,p3.x),y:f(p0.y,p1.y,p2.y,p3.y),z:p1.z}); }
  }
  const last=W.at(-1); if(last.m) marks[last.m]=P.length; P.push({x:last.x,y:last.y,z:last.z});
  const cum=[0]; for(let i=1;i<P.length;i++) cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
  const ms={}; for(const k in marks) ms[k]=cum[marks[k]];
  return Object.assign({P,cum,L:cum.at(-1),marks:ms,
    at(s){ s=clamp(s,0,this.L-0.01); let lo=1,hi=P.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<s) lo=m+1; else hi=m; }
      const a=P[lo-1],b=P[lo],t=(s-cum[lo-1])/((cum[lo]-cum[lo-1])||1),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
      return {x:a.x+dx*t,y:a.y+dy*t,nx:-dy/l,ny:dx/l,z:a.z}; }},opts||{});
}
const svgEl=(tag,attrs,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };

// ---------- shared state ----------
const S={view:"heart",playing:!RM,rate:0.25,bpm:72,t:0,beats:0,sound:false,labels:true,ecg:true,
  move:{atria:true,ventricles:true,valves:true,rblood:true,lblood:true,elec:true,coronary:false},
  leaky:false,selected:null,follow:null,quiz:null,stepTo:null,exercise:false,
  circ:{pulm:true,sys:true,beds:{brain:true,gut:true,kidney:true,skin:true,muscle:true}}};
let AC=null;
function thump(f,len,vol){ if(!S.sound) return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime; o.type="sine"; o.frequency.setValueAtTime(f,now); o.frequency.exponentialRampToValueAtTime(f*0.55,now+len);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(vol,now+0.012); g.gain.exponentialRampToValueAtTime(0.0001,now+len); o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+len+0.02); }catch(e){} }

// ============================================================
// HEART CROSS-SECTION
// ============================================================
const PH=[{k:"AS",name:"Atrial systole",a:0,b:0.125},{k:"VS",name:"Ventricular systole",a:0.125,b:0.5},{k:"D",name:"Diastole",a:0.5,b:1}];
const PHTXT={AS:"The atria contract and push blood through the open tricuspid and bicuspid valves into the ventricles. The semilunar valves stay closed, so blood cannot flow back from the arteries.",
 VS:"The ventricles contract. Rising pressure shuts the tricuspid and bicuspid valves (the “lub” sound) and opens the semilunar valves. Blood is forced into the pulmonary artery and the aorta. The tendons stop the valves turning inside out.",
 D:"The heart muscle relaxes. The semilunar valves close (the “dub” sound), so blood cannot flow back from the arteries. Blood from the veins fills the atria and flows on into the ventricles through the open valves."};
const phaseOf=t=>PH.find(p=>t>=p.a&&t<p.b)||PH[2];
const CH={ra:{x:285,y:238},la:{x:512,y:236},rv:{x:312,y:398},lv:{x:482,y:405}};
const PARTS={
 ra:{n:"Right atrium",b:"d",t:"Receives deoxygenated blood from the body through the vena cava, then contracts to push it into the right ventricle. Its wall is thin: it only pumps blood a short way.",g:"ra"},
 la:{n:"Left atrium",b:"o",t:"Receives oxygenated blood from the lungs through the pulmonary veins, then contracts to push it into the left ventricle.",g:"la"},
 rv:{n:"Right ventricle",b:"d",t:"Pumps deoxygenated blood to the lungs through the pulmonary artery. Its wall is thinner than the left ventricle's because the lungs are close and the pressure needed is lower.",g:"rv"},
 lv:{n:"Left ventricle",b:"o",t:"Pumps oxygenated blood to the whole body through the aorta. It has the thickest muscular wall, because it must make enough pressure to push blood all round the body.",g:"lv"},
 septum:{n:"Septum",t:"The wall of muscle between the left and right sides of the heart. It keeps oxygenated and deoxygenated blood apart.",g:"septum"},
 tric:{n:"Tricuspid valve",b:"d",t:"Atrioventricular valve between the right atrium and right ventricle. It opens to let blood into the ventricle and closes when the ventricle contracts, stopping backflow into the atrium.",g:"tric"},
 mitral:{n:"Bicuspid (mitral) valve",b:"o",t:"Atrioventricular valve between the left atrium and left ventricle. It has two flaps and closes when the left ventricle contracts.",g:"mitral"},
 pvalve:{n:"Semilunar valve (pulmonary)",b:"d",t:"Half-moon-shaped valve at the base of the pulmonary artery. It opens when the right ventricle contracts and closes when it relaxes, so blood cannot flow back into the heart.",g:"pvalve"},
 avalve:{n:"Semilunar valve (aortic)",b:"o",t:"Half-moon-shaped valve at the base of the aorta. It opens during ventricular systole and closes at the start of diastole: the “dub” sound.",g:"avalve"},
 svc:{n:"Vena cava (superior)",b:"d",t:"Large vein bringing deoxygenated blood from the head and arms into the right atrium.",g:"svc"},
 ivc:{n:"Vena cava (inferior)",b:"d",t:"Large vein bringing deoxygenated blood from the lower body into the right atrium.",g:"ivc"},
 pa:{n:"Pulmonary artery",b:"d",t:"Carries deoxygenated blood from the right ventricle to the lungs. It is the only artery that carries deoxygenated blood.",g:"pa"},
 pv:{n:"Pulmonary veins",b:"o",t:"Carry oxygenated blood from the lungs back to the left atrium. They are the only veins that carry oxygenated blood.",g:"pv"},
 aorta:{n:"Aorta",b:"o",t:"The largest artery. It carries oxygenated blood at high pressure from the left ventricle to every part of the body except the lungs.",g:"aorta"},
 chordae:{n:"Tendons (chordae tendineae)",t:"Tough cords attaching the tricuspid and bicuspid valves to muscles in the ventricle walls. They stop the valves turning inside out when the ventricles contract.",g:"chordae"},
 coronary:{n:"Coronary arteries",b:"o",t:"Branch from the base of the aorta and supply the heart muscle itself with oxygen and glucose. A blockage here causes a heart attack.",g:"coronary"},
 san:{n:"Pacemaker (sinoatrial node)",t:"A patch of tissue in the wall of the right atrium that starts each heartbeat with an electrical impulse. The impulse spreads over the atria, pauses at the atrioventricular node, then travels down the septum and up the ventricle walls (A Level).",g:"san"}};
let H=null;
function buildHeart(){
  const svg=svgEl("svg",{viewBox:"0 0 800 640",role:"img","aria-label":"Live cross-section of the human heart"});
  const defs=svgEl("defs",{},svg);
  defs.innerHTML=`<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6966"/></marker>
   <radialGradient id="glow"><stop offset="0" stop-color="#ffe14d" stop-opacity="1"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>`;
  const g=svgEl("g",{},svg);
  // vessel tube helper: wall path + lumen path
  const tube=(id,d,w,side,parent)=>{ const grp=svgEl("g",{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n},parent||g);
    svgEl("path",{d,fill:"none",stroke:side==="r"?"#8193cf":"#d9706c","stroke-width":w,"stroke-linecap":"butt","stroke-linejoin":"round"},grp);
    svgEl("path",{d,fill:"none",stroke:side==="r"?"var(--cav-r)":"var(--cav-l)","stroke-width":w-9,"stroke-linecap":"butt","stroke-linejoin":"round"},grp); return grp; };
  // ----- behind: descending aorta, vena cavae, pulmonary veins -----
  tube("aorta","M612 92 C624 140, 626 200, 626 640",30,"l");
  tube("ivc","M206 640 C206 520, 208 420, 224 330 C232 300, 244 288, 258 282",32,"r");
  tube("svc","M282 0 L282 196",32,"r");
  const pvG=svgEl("g",{class:"part","data-part":"pv",tabindex:0,role:"button","aria-label":PARTS.pv.n},g);
  ["M800 214 C700 214, 620 214, 556 226","M800 262 C700 262, 620 262, 556 252"].forEach(d=>{ svgEl("path",{d,fill:"none",stroke:"#d9706c","stroke-width":24},pvG); svgEl("path",{d,fill:"none",stroke:"var(--cav-l)","stroke-width":15},pvG); });
  // ----- chambers -----
  const chamber=(id,d,wall,side)=>{ const grp=svgEl("g",{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n},g);
    svgEl("path",{d,fill:"var(--muscle)",stroke:"var(--muscle)","stroke-width":wall*2,"stroke-linejoin":"round"},grp);
    svgEl("path",{d,fill:"none",stroke:"var(--muscle-d)","stroke-width":wall*2+2.5,"stroke-linejoin":"round",opacity:.0},grp);
    const cav=svgEl("path",{d,fill:side==="r"?"var(--cav-r)":"var(--cav-l)"},grp); return {grp,cav}; };
  const outline=svgEl("path",{d:"",fill:"none"},g);
  const rv=chamber("rv","M246 316 L374 316 C384 360, 386 410, 374 452 C360 488, 318 494, 290 472 C262 448, 246 384, 246 316 Z",11,"r");
  const lv=chamber("lv","M424 316 L542 316 C552 362, 544 424, 518 468 C498 504, 466 520, 448 508 C430 494, 422 444, 424 316 Z",24,"l");
  const ra=chamber("ra","M232 242 C232 198, 262 180, 288 182 C318 184, 340 206, 340 240 C340 270, 330 290, 316 300 L264 300 C244 292, 232 270, 232 242 Z",10,"r");
  const la=chamber("la","M460 238 C460 204, 482 188, 512 188 C542 188, 564 208, 564 236 C564 262, 552 282, 540 292 L486 292 C468 280, 460 262, 460 238 Z",10,"l");
  // AV channels (part of atria visually)
  svgEl("rect",{x:270,y:292,width:68,height:34,fill:"var(--cav-r)"},ra.grp);
  svgEl("rect",{x:470,y:286,width:62,height:40,fill:"var(--cav-l)"},la.grp);
  // papillary muscles
  [[290,452,18,10],[336,458,16,9]].forEach(([x,y,rx,ry])=>svgEl("ellipse",{cx:x,cy:y,rx,ry,fill:"var(--muscle)"},rv.grp));
  [[470,478,18,11],[518,452,16,10]].forEach(([x,y,rx,ry])=>svgEl("ellipse",{cx:x,cy:y,rx,ry,fill:"var(--muscle)"},lv.grp));
  // septum hit area
  const sep=svgEl("path",{d:"M376 330 L422 330 L428 470 L392 480 Z",fill:"transparent",class:"part","data-part":"septum",tabindex:0,role:"button","aria-label":"Septum"},g);
  // ----- front: pulmonary artery, ascending aorta + arch -----
  const paG=tube("pa","M360 330 L360 160 M360 160 C330 150, 260 146, 0 146 M360 160 C420 150, 520 146, 800 146",30,"r");
  const aoG=tube("aorta","M440 330 L440 150 C440 92, 470 60, 520 56 C570 54, 600 66, 612 92",34,"l");
  ["M486 60 L486 0","M528 56 L528 0","M566 60 L570 0"].forEach(d=>{ svgEl("path",{d,fill:"none",stroke:"#d9706c","stroke-width":16},aoG); svgEl("path",{d,fill:"none",stroke:"var(--cav-l)","stroke-width":9},aoG); });
  // coronary arteries on the surface
  const cor=svgEl("g",{class:"part","data-part":"coronary",tabindex:0,role:"button","aria-label":PARTS.coronary.n},g);
  const corD=["M458 312 C520 298, 584 318, 586 392 C588 452, 556 520, 486 548","M584 400 C600 430, 598 470, 580 500","M424 312 C360 300, 236 300, 228 352 C222 410, 236 470, 288 500"];
  const corPaths=corD.map(d=>svgEl("path",{d,fill:"none",stroke:"#b5121b","stroke-width":4.5,"stroke-linecap":"round"},cor));
  // valves
  const valveG={};
  const flap=(parent,x,y)=>svgEl("line",{x1:x,y1:y,x2:x,y2:y,stroke:"#f7efe2","stroke-width":5,"stroke-linecap":"round"},parent);
  const mkAV=(id,x1,x2,y)=>{ const grp=svgEl("g",{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n},g); svgEl("rect",{x:x1-6,y:y-10,width:x2-x1+12,height:44,fill:"transparent"},grp);
    const a=flap(grp,x1,y), b=flap(grp,x2,y); [a,b].forEach(l=>l.setAttribute("stroke","#fffaf0")); const out=svgEl("g",{},grp);
    [a,b].forEach(l=>{ const sh=l.cloneNode(); sh.setAttribute("stroke","#8a3a33"); sh.setAttribute("stroke-width","8"); grp.insertBefore(sh,l); l._sh=sh; });
    return {grp,x1,x2,y,a,b,ang:0}; };
  valveG.tric=mkAV("tric",272,336,318); valveG.mitral=mkAV("mitral",472,530,318);
  const mkSL=(id,cx,y,half)=>{ const grp=svgEl("g",{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n},g); svgEl("rect",{x:cx-half-6,y:y-26,width:half*2+12,height:40,fill:"transparent"},grp);
    const a=flap(grp,cx-half,y), b=flap(grp,cx+half,y); [a,b].forEach(l=>{ const sh=l.cloneNode(); sh.setAttribute("stroke","#8a3a33"); sh.setAttribute("stroke-width","8"); grp.insertBefore(sh,l); l._sh=sh; });
    return {grp,cx,y,half,a,b,ang:0}; };
  valveG.pvalve=mkSL("pvalve",360,300,11); valveG.avalve=mkSL("avalve",440,300,13);
  // chordae
  const chG=svgEl("g",{class:"part","data-part":"chordae",tabindex:0,role:"button","aria-label":PARTS.chordae.n},g);
  const chords=[[valveG.tric,"a",[290,444]],[valveG.tric,"b",[336,450]],[valveG.mitral,"a",[470,470]],[valveG.mitral,"b",[518,444]]].map(([v,w,pt])=>{ const l=svgEl("line",{stroke:"#fff","stroke-width":1.6,opacity:.9},chG); const hit=svgEl("line",{stroke:"transparent","stroke-width":12},chG); return {v,w,pt,l,hit}; });
