<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const OXY=[212,35,47], DEOXY=[47,78,160];
const mixc=t=>`rgb(${OXY.map((v,i)=>Math.round(lerp(DEOXY[i],v,t))).join(",")})`;
const RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- smooth routes (Catmull-Rom through waypoints) ----------
function mkRoute(pts,opts){
  const W=pts.map(p=>({x:p[0],y:p[1],z:p[2],m:p[3]||null}));
  const P=[]; const marks={};
  for(let i=0;i<W.length-1;i++){
    const p0=W[Math.max(0,i-1)],p1=W[i],p2=W[i+1],p3=W[Math.min(W.length-1,i+2)];
    if(p1.m) marks[p1.m]=P.length;
    for(let k=0;k<10;k++){ const t=k/10,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      P.push({x:f(p0.x,p1.x,p2.x,p3.x),y:f(p0.y,p1.y,p2.y,p3.y),z:p1.z}); }
  }
  const last=W.at(-1); if(last.m) marks[last.m]=P.length; P.push({x:last.x,y:last.y,z:last.z});
  const cum=[0]; for(let i=1;i<P.length;i++) cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
  const ms={}; for(const k in marks) ms[k]=cum[marks[k]];
  return Object.assign({P,cum,L:cum.at(-1),marks:ms,
    at(s){ s=clamp(s,0,this.L-0.01); let lo=1,hi=P.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<s) lo=m+1; else hi=m; }
      const a=P[lo-1],b=P[lo],t=(s-cum[lo-1])/((cum[lo]-cum[lo-1])||1),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
      return {x:a.x+dx*t,y:a.y+dy*t,nx:-dy/l,ny:dx/l,z:a.z}; }},opts||{});
}
const svgEl=(tag,attrs,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };

// ---------- shared state ----------
const S={view:"heart",playing:!RM,rate:0.25,bpm:72,t:0,beats:0,sound:false,labels:true,ecg:true,
  move:{atria:true,ventricles:true,valves:true,rblood:true,lblood:true,elec:true,coronary:false},
  leaky:false,selected:null,follow:null,quiz:null,stepTo:null,exercise:false,
  circ:{pulm:true,sys:true,beds:{brain:true,gut:true,kidney:true,skin:true,muscle:true}}};
let AC=null;
function thump(f,len,vol){ if(!S.sound) return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime; o.type="sine"; o.frequency.setValueAtTime(f,now); o.frequency.exponentialRampToValueAtTime(f*0.55,now+len);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(vol,now+0.012); g.gain.exponentialRampToValueAtTime(0.0001,now+len); o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+len+0.02); }catch(e){} }

// ============================================================
// HEART CROSS-SECTION
// ============================================================
const PH=[{k:"AS",name:"Atrial systole",a:0,b:0.125},{k:"VS",name:"Ventricular systole",a:0.125,b:0.5},{k:"D",name:"Diastole",a:0.5,b:1}];
const PHTXT={AS:"The atria contract and push blood through the open tricuspid and bicuspid valves into the ventricles. The semilunar valves stay closed, so blood cannot flow back from the arteries.",
 VS:"The ventricles contract. Rising pressure shuts the tricuspid and bicuspid valves (the “lub” sound) and opens the semilunar valves. Blood is forced into the pulmonary artery and the aorta. The tendons stop the valves turning inside out.",
 D:"The heart muscle relaxes. The semilunar valves close (the “dub” sound), so blood cannot flow back from the arteries. Blood from the veins fills the atria and flows on into the ventricles through the open valves."};
const phaseOf=t=>PH.find(p=>t>=p.a&&t<p.b)||PH[2];
const PARTS={
 ra:{n:"Right atrium",b:"d",t:"Receives deoxygenated blood from the body through the vena cava, then contracts to push it into the right ventricle. Its wall is thin: it only pumps blood a short way.",g:"ra"},
 la:{n:"Left atrium",b:"o",t:"Receives oxygenated blood from the lungs through the pulmonary veins, then contracts to push it into the left ventricle.",g:"la"},
 rv:{n:"Right ventricle",b:"d",t:"Pumps deoxygenated blood to the lungs through the pulmonary artery. Its wall is thinner than the left ventricle's because the lungs are close and the pressure needed is lower.",g:"rv"},
 lv:{n:"Left ventricle",b:"o",t:"Pumps oxygenated blood to the whole body through the aorta. It has the thickest muscular wall, because it must make enough pressure to push blood all round the body.",g:"lv"},
 septum:{n:"Septum",t:"The wall of muscle between the left and right sides of the heart. It keeps oxygenated and deoxygenated blood apart.",g:"septum"},
 tric:{n:"Tricuspid valve",b:"d",t:"Atrioventricular valve between the right atrium and right ventricle. It opens to let blood into the ventricle and closes when the ventricle contracts, stopping backflow into the atrium.",g:"tric"},
 mitral:{n:"Bicuspid (mitral) valve",b:"o",t:"Atrioventricular valve between the left atrium and left ventricle. It has two flaps and closes when the left ventricle contracts.",g:"mitral"},
 pvalve:{n:"Semilunar valve (pulmonary)",b:"d",t:"Half-moon-shaped valve at the base of the pulmonary artery. It opens when the right ventricle contracts and closes when it relaxes, so blood cannot flow back into the heart.",g:"pvalve"},
 avalve:{n:"Semilunar valve (aortic)",b:"o",t:"Half-moon-shaped valve at the base of the aorta. It opens during ventricular systole and closes at the start of diastole: the “dub” sound.",g:"avalve"},
 svc:{n:"Vena cava (superior)",b:"d",t:"Large vein bringing deoxygenated blood from the head and arms into the right atrium.",g:"svc"},
 ivc:{n:"Vena cava (inferior)",b:"d",t:"Large vein bringing deoxygenated blood from the lower body into the right atrium.",g:"ivc"},
 pa:{n:"Pulmonary artery",b:"d",t:"Carries deoxygenated blood from the right ventricle to the lungs. It is the only artery that carries deoxygenated blood.",g:"pa"},
 pv:{n:"Pulmonary veins",b:"o",t:"Carry oxygenated blood from the lungs back to the left atrium. They are the only veins that carry oxygenated blood.",g:"pv"},
 aorta:{n:"Aorta",b:"o",t:"The largest artery. It carries oxygenated blood at high pressure from the left ventricle to every part of the body except the lungs.",g:"aorta"},
 chordae:{n:"Tendons (chordae tendineae)",t:"Tough cords attaching the tricuspid and bicuspid valves to muscles in the ventricle walls. They stop the valves turning inside out when the ventricles contract.",g:"chordae"},
 coronary:{n:"Coronary arteries",b:"o",t:"Branch from the base of the aorta and supply the heart muscle itself with oxygen and glucose. A blockage here causes a heart attack.",g:"coronary"},
 myo:{n:"Heart muscle (cardiac muscle)",t:"The wall of the heart is cardiac muscle, which contracts again and again without tiring. Look how much thicker it is round the left ventricle than round the right ventricle and the atria. The muscle gets its own oxygen and glucose from the coronary arteries.",g:"myo"},
 san:{n:"Pacemaker (sinoatrial node)",t:"A patch of tissue in the wall of the right atrium that starts each heartbeat with an electrical impulse. The impulse spreads over the atria, pauses at the atrioventricular node, then travels down the septum and up the ventricle walls (A Level).",g:"san"}};
let H=null;
// Geometry of a textbook frontal (four-chamber) section, viewBox 800 x 640.
// Myocardium is one continuous muscle; cavities are cut into it. Ventricles shorten towards the base when they contract.
const HG={
 outer:"M244 198 C224 202, 212 224, 212 254 C212 284, 218 302, 226 314 C220 324, 220 334, 222 346 C226 400, 244 456, 286 498 C330 540, 410 580, 470 598 C490 604, 510 604, 528 594 C578 566, 612 500, 620 420 C624 370, 620 340, 610 324 C616 306, 614 290, 610 262 C606 222, 584 200, 540 198 C508 196, 478 206, 468 226 C460 244, 440 256, 412 258 C380 260, 350 252, 334 236 C326 212, 300 196, 270 196 C258 196, 250 196, 244 198 Z",
 ra:"M246 322 C236 312, 228 296, 228 270 C228 232, 244 206, 274 204 C302 202, 318 222, 318 252 C318 282, 316 302, 310 322 Z",
 la:"M480 322 C474 304, 472 282, 474 256 C478 226, 500 208, 532 208 C566 208, 590 226, 592 256 C594 284, 586 306, 548 322 Z",
 rv:"M246 322 L372 322 C376 380, 386 440, 404 494 C386 508, 362 512, 336 504 C298 490, 262 456, 248 410 C240 384, 238 350, 246 322 Z",
 lv:"M404 322 L560 322 C572 380, 568 452, 542 502 C524 538, 500 552, 478 546 C462 540, 452 524, 446 504 C430 452, 414 390, 404 322 Z",
 sep:"M372 322 L404 322 C414 390, 430 452, 446 504 C452 524, 462 540, 470 556 L430 560 C410 530, 404 512, 404 494 C386 440, 376 380, 372 322 Z"};
const XC={ra:[273,262],la:[533,262],rv:[308,322],lv:[484,322]}, MC=[410,320];
function buildHeart(){
  const svg=svgEl("svg",{viewBox:"0 0 800 640",role:"img","aria-label":"Live cross-section of the human heart"});
  const defs=svgEl("defs",{},svg);
  defs.innerHTML=`<radialGradient id="glow"><stop offset="0" stop-color="#ffe14d" stop-opacity="1"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
   <radialGradient id="myo" gradientUnits="userSpaceOnUse" cx="380" cy="300" r="340" fx="330" fy="250"><stop offset="0" stop-color="#e7837a"/><stop offset=".45" stop-color="#cf5a51"/><stop offset=".8" stop-color="#ad3b35"/><stop offset="1" stop-color="#8c2a26"/></radialGradient>
   <radialGradient id="cavR" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#eef1fb"/><stop offset=".75" stop-color="#d8def3"/><stop offset="1" stop-color="#c2cbec"/></radialGradient>
   <radialGradient id="cavL" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fdf0ee"/><stop offset=".75" stop-color="#f8d9d5"/><stop offset="1" stop-color="#f0c1bb"/></radialGradient>
   <radialGradient id="rbcO"><stop offset="0" stop-color="#ef6a6f"/><stop offset=".45" stop-color="#d42a35"/><stop offset=".8" stop-color="#b3141f"/><stop offset="1" stop-color="#8a0d16"/></radialGradient>
   <radialGradient id="rbcD"><stop offset="0" stop-color="#7d93d6"/><stop offset=".45" stop-color="#3c5ab0"/><stop offset=".8" stop-color="#2a4290"/><stop offset="1" stop-color="#1b2c66"/></radialGradient>
   <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
   <filter id="hshadow" x="-10%" y="-10%" width="120%" height="125%"><feGaussianBlur stdDeviation="7"/></filter>
   <clipPath id="clipA"><rect x="0" y="0" width="800" height="321"/></clipPath><clipPath id="clipV"><rect x="0" y="319" width="800" height="330"/></clipPath>
   <clipPath id="clipOuter"><path d="${HG.outer}"/></clipPath>`;
  const g=svgEl("g",{},svg);
  // vessel drawn as a cut-open tube: dark outline, coloured wall, pale lumen with a lighter core
  const VC={r:{o:"#1d2d68",w:"#4b66b8",l:"#dce2f5",c:"#eef1fb"},l:{o:"#741515",w:"#c7333b",l:"#f8d6d2",c:"#fdecea"}};
  const tube=(id,paths,W,side,parent)=>{ const grp=svgEl("g",id?{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n}:{},parent||g); const c=VC[side];
    const P=paths.map(p=>typeof p==="string"?{d:p,w:W}:p);
    [["o",3],["w",0],["l",-11],["c",-19]].forEach(([k,dw])=>P.forEach(p=>{ const w=p.w+dw*(p.w/W); if(w>0) svgEl("path",{d:p.d,fill:"none",stroke:c[k],"stroke-width":w.toFixed(1),"stroke-linecap":"butt","stroke-linejoin":"round"},grp); }));
    return grp; };
  // ----- behind the heart: the descending part of the aorta -----
  tube("aorta",["M538 58 C578 58, 594 86, 594 132 L594 660"],38,"l");
  // ----- heart muscle: soft shadow, then atrial and ventricular halves -----
  svgEl("path",{d:HG.outer,fill:"#3b0c0a",opacity:.22,transform:"translate(6 9)",filter:"url(#hshadow)"},g);
  const myoAttrs={class:"part","data-part":"myo","data-also":"myo ra la rv lv septum",tabindex:0,role:"button","aria-label":"Heart muscle"};
  const half=(clip)=>{ const grp=svgEl("g",{"clip-path":`url(#${clip})`},g); const inner=svgEl("g",{},grp);
    svgEl("path",Object.assign({d:HG.outer,fill:"url(#myo)"},myoAttrs),inner);
    svgEl("path",{d:HG.outer,fill:"url(#sheen)","pointer-events":"none"},inner);
    svgEl("path",{d:HG.outer,fill:"none",stroke:"#5e1714","stroke-width":2.4,"pointer-events":"none"},inner);
    return {grp,inner}; };
  const A=half("clipA"), V=half("clipV");
  // chambers: endocardium lining, cavity, papillary muscles and ridged walls (trabeculae)
  const chamber=(id,parent,side)=>{ const grp=svgEl("g",{class:"part","data-part":id,tabindex:0,role:"button","aria-label":PARTS[id].n},parent);
    svgEl("path",{d:HG[id],fill:"none",stroke:"#f2b6ad","stroke-width":5,"stroke-linejoin":"round"},grp);
    const cav=svgEl("path",{d:HG[id],fill:`url(#cav${side==="r"?"R":"L"})`,stroke:"#8f2e2a","stroke-width":1,"stroke-opacity":.35},grp); return {grp,cav}; };
  const ra=chamber("ra",A.inner,"r"), la=chamber("la",A.inner,"l"), rv=chamber("rv",V.inner,"r"), lv=chamber("lv",V.inner,"l");
  // papillary muscles: cone-shaped, rising from the ventricle floor
  const papi=(grp,base,tip,w)=>{ const [bx,by]=base,[tx,ty]=tip, dx=tx-bx, dy=ty-by, l=Math.hypot(dx,dy), ux=dx/l, uy=dy/l, nx=-uy*w, ny=ux*w, f=v=>v.toFixed(1);

function tagText(svg,pre,big){ svg.querySelectorAll("text").forEach(t=>{ const fs=+t.getAttribute("font-size")||14; t.classList.add(fs>=big?pre+"-h":fs>=14?pre:pre+"-s"); }); }
function tubeD(x0,x1,yc,rFn,outer,side){ // top or bottom wall polygon
  let d=""; const n=60; for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n, r=rFn(x); d+=(i?"L":"M")+x.toFixed(1)+" "+(yc+side*r).toFixed(1); }
  for(let i=n;i>=0;i--){ const x=x0+(x1-x0)*i/n, r=rFn(x); d+="L"+x.toFixed(1)+" "+(yc+side*(r+outer(x))).toFixed(1); } return d+"Z"; }
function tickVess(dtReal){

function vessSide(){

    <div class="ctl"><label for="rate">Speed <span id="ratev"></span></label><input type="range" id="rate" min="0" max="3" step="1"></div></div>
   <div class="card"><h2>Watch for</h2><ul style="margin:0;padding-left:1.2em;font-size:.9rem"><li><b>Artery:</b> the wall stretches as each pulse passes, then recoils. That is the pulse you feel at your wrist.</li><li><b>Vein:</b> when the leg muscle squeezes, the valve behind shuts and the valve ahead opens, so blood can only move towards the heart.</li><li><b>Capillary:</b> oxygen (yellow) diffuses out to the cells and carbon dioxide (grey) diffuses in. The red cells darken as they lose oxygen.</li></ul></div>`;
  const rates=[0.1,0.25,0.5,1], rn=["Very slow (10%)","Slow motion (25%)","Half speed","Real time"];

  <tr><td><b>Direction</b></td><td>Away from the heart</td><td>Towards the heart</td><td>Between arterioles and venules</td></tr>
  <tr><td><b>Wall</b></td><td>Thick, with muscle and elastic tissue</td><td>Thin, little muscle</td><td>One cell thick</td></tr>
  <tr><td><b>Lumen</b></td><td>Narrow</td><td>Wide</td><td>About one red cell wide</td></tr>
  <tr><td><b>Pressure</b></td><td>High, in pulses</td><td>Low, steady</td><td>Falling</td></tr>
  <tr><td><b>Valves</b></td><td>No (only at the heart)</td><td>Yes, to stop backflow</td><td>No</td></tr>
  <tr><td><b>Blood</b></td><td>Oxygenated (except the pulmonary artery)</td><td>Deoxygenated (except the pulmonary veins)</td><td>Loses oxygen to the cells</td></tr></tbody></table></div>`;
}
