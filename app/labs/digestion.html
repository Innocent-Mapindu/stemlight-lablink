      if(m.x<10||m.x>790) m.vx*=-1; if(m.y<12) m.vy=Math.abs(m.vy); if(m.y>VB-6){ m.y=VB-6; m.vy=-Math.abs(m.vy); }

    else if(m.st==="in"){ m.t+=dt*1.6; const tgtX=(m.k==="fa"||m.k==="gly")?VX+xs(m.y):(m.x<VX+xs(m.y)?VX-w*0.55:VX+w*0.55)+xs(m.y); m.x=lerp(m.x0,tgtX,clamp(m.t,0,1)); if(m.t>=1){ m.st=(m.k==="fa"||m.k==="gly")?"lymph":"blood"; VI.stats[m.k==="glu"?"glu":m.k==="ami"?"ami":"fat"]++; } }
    else { // carried down and out of the villus
      m.y+=110*dt*(V.flow?1:0.2); if(m.st==="blood") m.x=lerp(m.x,VX+w*0.55+xs(m.y),0.08); else m.x=VX+xs(m.y);
      if(m.y>VB+80){ const n=VI.mkMol(m.k); n.y=10+Math.random()*30; m.el.remove(); VI.mols[i]=n; return; } }
    m.el.setAttribute("transform",`translate(${f1(m.x)} ${f1(m.y)}) rotate(${f1(m.rot)})`); m.el.setAttribute("opacity",m.st==="lumen"?1:0.85); });
  VI.mz.setAttribute("visibility",V.micro?"visible":"hidden");
  if(S.frameN%8===0&&$("vglu")){ $("vglu").textContent=VI.stats.glu; $("vami").textContent=VI.stats.ami; $("vfat").textContent=VI.stats.fat; } }
function villusSide(){
  const V=S.vil;
  $("side").innerHTML=`<div class="card"><h2>Absorption in the small intestine</h2><p style="margin:0;font-size:.9rem">Digested food molecules are small enough to pass through the wall of the villus. <b>Glucose and amino acids</b> go into the blood capillaries and travel to the liver in the hepatic portal vein. <b>Fatty acids and glycerol</b> go into the lacteal and are carried away in the lymph.</p>
    <div class="vstate"><span>Glucose absorbed into the blood</span><span class="op" id="vglu" style="color:var(--ink)"></span><span>Amino acids absorbed into the blood</span><span class="op" id="vami" style="color:var(--ink)"></span><span>Fatty acids and glycerol into the lacteal</span><span class="op" id="vfat" style="color:var(--ink)"></span></div>
    <div class="row" style="margin-top:10px"><button class="primary" id="play"></button></div>
    <div class="ctl"><label for="rate">Speed <span id="ratev"></span></label><input type="range" id="rate" min="0" max="2" step="1"></div></div>
   <div class="card"><h2>Choose what is shown</h2><div class="chips"><label class="chip"><input type="checkbox" id="vflow" ${V.flow?"checked":""}>Blood and lymph flowing</label><label class="chip"><input type="checkbox" id="vmicro" ${V.micro?"checked":""}>Zoom in on the microvilli</label><label class="chip"><input type="checkbox" id="lbl" ${S.labels?"checked":""}>Labels</label></div>
    <h2 style="margin-top:12px">What if…</h2><label class="chip"><input type="checkbox" id="vco" ${V.coeliac?"checked":""}>Coeliac disease (flattened villi)</label><div id="vmsg"></div></div>
   <div class="card info" id="info"><h2>Why the ileum absorbs so well</h2><ul style="margin:4px 0 0;padding-left:18px;font-size:.9rem"><li><b>Very long</b>, about 6 metres.</li><li><b>Millions of villi</b>, each covered in microvilli: a huge surface area.</li><li><b>Thin wall</b>: the epithelium is one cell thick.</li><li><b>Rich blood supply</b> carries food away, keeping the concentration gradient steep.</li><li><b>Lacteals</b> absorb the products of fat digestion.</li></ul>
    <div class="chips" style="margin-top:10px">${["villus","epith","capil","lacteal","wall"].map(k=>`<button class="chip" data-pick="${k}">${esc(PARTS[k].n)}</button>`).join("")}</div></div>`;
  commonControls();
  $("vflow").onchange=e=>{ V.flow=e.target.checked; }; $("vmicro").onchange=e=>{ V.micro=e.target.checked; };
  const msg=()=>{ $("vmsg").innerHTML=V.coeliac?`<div class="msg warn">In coeliac disease the lining reacts to gluten (a protein in wheat). The villi become flattened, so there is far less surface area: watch how few molecules are absorbed. People with coeliac disease can lose weight and become tired and anaemic. A gluten-free diet lets the villi grow back.</div>`:""; };
  $("vco").onchange=e=>{ V.coeliac=e.target.checked; VI.stats={glu:0,ami:0,fat:0}; msg(); }; msg();
  $("side").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>showInfo(b.dataset.pick)); }

// ---------- shared controls, info and quiz ----------
function commonControls(){
  const rates=[0.25,0.5,1], rn=["Slow motion (25%)","Half speed","Normal"];
  if(!rates.includes(S.rate)) S.rate=1;
  $("rate").value=rates.indexOf(S.rate); const setRate=()=>{ S.rate=rates[+$("rate").value]; $("ratev").textContent=rn[+$("rate").value]; }; $("rate").oninput=setRate; setRate();
  const playLbl=()=>$("play").textContent=S.playing?"Pause":"Play"; $("play").onclick=()=>{ S.playing=!S.playing; S.stepTo=null; playLbl(); }; playLbl();
  if($("lbl")) $("lbl").onchange=e=>{ S.labels=e.target.checked; applyLabels(); }; }
function cur(){ return S.view==="journey"?J:S.view==="enz"?EZ:VI; }
function applyLabels(){ cur().labs.forEach(l=>l.grp.setAttribute("visibility",S.labels?"visible":"hidden")); }
function dimTo(id){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.toggle("dim",e.dataset.part!==id)); }
function undim(){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.remove("dim")); }
function showInfo(id){ const p=PARTS[id]; if(!p||!$("info")) return; S.selected=id; dimTo(id);
  $("info").innerHTML=`<h3>${esc(p.n)}</h3><p>${esc(p.t)}</p><div class="row" style="margin-top:6px"><button id="clr">Show everything</button>${id==="ileum"?`<button class="primary" id="govil">See absorption</button>`:""}${["saliv","stomach","pancreas"].includes(id)?`<button id="goenz">See the enzymes work</button>`:""}</div>`;
  $("clr").onclick=()=>{ S.selected=null; undim(); setView(S.view); };
  if($("govil")) $("govil").onclick=()=>setView("villus");
  if($("goenz")) $("goenz").onclick=()=>{ S.enz.kind=id==="stomach"?"pepsin":id==="pancreas"?"trypsin":"amylase"; S.enz.pHset=null; if(EZ) resetEnz(); setView("enz"); }; }
const QZ=[{tap:"stomach",q:"Tap the stomach."},{tap:"liver",q:"Tap the liver."},{tap:"pancreas",q:"Tap the pancreas."},{tap:"ileum",q:"Tap the small intestine, where most digested food is absorbed."},
 {q:"Where does the digestion of protein begin?",o:["In the mouth","In the stomach","In the large intestine","In the liver"],a:1},
 {q:"What does bile do?",o:["Digests protein","Emulsifies fats and neutralises stomach acid","Absorbs water","Turns starch into maltose"],a:1},
 {q:"Which enzyme breaks starch down into maltose?",o:["Lipase","Pepsin","Amylase","Trypsin"],a:2},
 {q:"Where is most of the water absorbed from undigested food?",o:["Stomach","Oesophagus","Large intestine","Rectum"],a:2}];
function startQuiz(){ S.quiz={i:0,score:0}; drawQuiz(); }
function drawQuiz(){ const Q=S.quiz, el=$("quiz"); if(!el) return;
  if(Q.i>=QZ.length){ el.innerHTML=`<h2>Test complete</h2><p class="phase" style="font-size:1.6rem;margin:4px 0">${Q.score} / ${QZ.length}</p><p>${Q.score===QZ.length?"Excellent: you know how we digest food.":"Tap the organs you missed to read about them, then try again."}</p><button class="primary" id="qagain">Try again</button>`; $("qagain").onclick=startQuiz;
    try{ parent.postMessage({type:"lablink-3d-result",prac:"digestion",score:Math.round(Q.score/QZ.length*100)},"*"); }catch(e){} Q.done=true; return; }
  const q=QZ[Q.i]; el.innerHTML=`<h2>Question ${Q.i+1} of ${QZ.length}</h2><div class="q"><p><b>${esc(q.q)}</b></p>${q.tap?`<p class="note">Tap it in the picture. Labels are hidden during the test.</p>`:`<div class="opts">${q.o.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join("")}</div>`}</div><div id="qfb"></div>`;
  if(q.tap){ S.labels=false; applyLabels(); }
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o===q.a,b,el.querySelector(`[data-o="${q.a}"]`))); }
function answer(ok,btn,right){ const Q=S.quiz; if(Q.lock) return; Q.lock=true; if(ok) Q.score++; if(btn){ btn.classList.add(ok?"right":"wrong"); if(right) right.classList.add("right"); }
  const q=QZ[Q.i]; $("qfb").innerHTML=`<div class="msg ${ok?"":"warn"}">${ok?"Correct.":q.tap?`Not quite: look at the highlighted organ, the ${esc(PARTS[q.tap].n.toLowerCase())}.`:"Not quite: the right answer is highlighted."}</div><button class="primary" id="qnext" style="margin-top:8px">${Q.i+1<QZ.length?"Next question":"See your score"}</button>`;
  if(q.tap&&!ok) dimTo(q.tap);
  $("qnext").onclick=()=>{ Q.lock=false; Q.i++; undim(); if(Q.i>=QZ.length){ S.labels=true; applyLabels(); } drawQuiz(); }; }

// ---------- shell ----------
const LEG={journey:`<span><i style="background:${NCOL.starch}"></i>Starch</span><span><i style="background:${NCOL.protein}"></i>Protein</span><span><i style="background:${NCOL.fat}"></i>Fat</span><span><i style="background:${NCOL.fibre}"></i>Fibre</span><span><i style="background:#5ea0d6"></i>Saliva and water</span><span><i style="background:#5f9a35"></i>Bile</span><span><i style="background:#e0a050"></i>Pancreatic juice</span><span><i style="background:#c9d94a"></i>Gastric juice</span>`,
 enz:`<span>Drag the temperature and pH sliders and watch how often the substrate fits the active site.</span>`,
 villus:`<span><i style="background:${NCOL.starch}"></i>Glucose</span><span><i style="background:${NCOL.protein}"></i>Amino acids</span><span><i style="background:${NCOL.fat}"></i>Fatty acids</span><span><i style="background:#f7e7b0"></i>Glycerol</span><span>Magnified about 200 times</span>`};
const BELOW={enz:`<h2>The digestive enzymes</h2><div class="tbl"><table><tr><th>Enzyme</th><th>Made in</th><th>Works in</th><th>Breaks down</th><th>Into</th></tr><tr><td>Amylase</td><td>Salivary glands, pancreas</td><td>Mouth, small intestine</td><td>Starch</td><td>Maltose</td></tr><tr><td>Maltase</td><td>Small intestine wall</td><td>Small intestine</td><td>Maltose</td><td>Glucose</td></tr><tr><td>Pepsin (protease)</td><td>Stomach wall</td><td>Stomach (pH 2)</td><td>Protein</td><td>Polypeptides</td></tr><tr><td>Trypsin (protease)</td><td>Pancreas</td><td>Small intestine</td><td>Protein and polypeptides</td><td>Peptides and amino acids</td></tr><tr><td>Lipase</td><td>Pancreas</td><td>Small intestine</td><td>Fats (lipids)</td><td>Fatty acids and glycerol</td></tr></table></div><p class="note">Test for starch: iodine solution turns blue-black. As amylase works, the blue-black colour disappears. Test for maltose and glucose (reducing sugars): heat with Benedict's solution; it turns from blue to brick red.</p>`};
function setView(v){
  S.view=v; document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
  const st=$("stage"); st.innerHTML=""; S.selected=null; S.quiz=null; $("legend").innerHTML=LEG[v]; $("below").hidden=!BELOW[v]; $("below").innerHTML=BELOW[v]||"";
  if(v==="journey"){ if(!J) buildJourney(); st.appendChild(J.svg); journeySide(); }
  else if(v==="enz"){ if(!EZ) buildEnz(); st.appendChild(EZ.svg); enzSide(); }
  else { if(!VI) buildVillus(); st.appendChild(VI.svg); villusSide(); }
  undim(); applyLabels(); fitLabels(); }
function fitLabels(){ const narrow=innerWidth<600;
  [J,VI].forEach(V=>{ if(!V) return; V.labs.forEach(l=>{ if(!l.tx) return; const words=l.t.split(" "); l.tx.textContent=""; l.tx.setAttribute("font-size",narrow?24:16);
    if(narrow&&words.length>1){ const cut=Math.ceil(words.length/2); [words.slice(0,cut).join(" "),words.slice(cut).join(" ")].forEach((w,i)=>{ const sp=document.createElementNS(NS,"tspan"); sp.setAttribute("x",l.x); sp.setAttribute("y",l.y+(i?13:-11)); sp.textContent=w; l.tx.appendChild(sp); }); l.ln.setAttribute("y1",l.y-8); }
    else { l.tx.textContent=l.t; l.ln.setAttribute("y1",l.y-5); } }); V.ctx.setAttribute("font-size",narrow?17:13); }); }
addEventListener("resize",fitLabels);
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("stage").addEventListener("click",e=>{ const p=e.target.closest(".part"); if(!p) return; const id=p.dataset.part;
  if(S.view==="journey"&&S.quiz&&!S.quiz.done&&QZ[S.quiz.i]&&QZ[S.quiz.i].tap&&!S.quiz.lock){ answer(id===QZ[S.quiz.i].tap); return; } showInfo(id); });
$("stage").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("part")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
let last=performance.now(); S.simTime=0;
const CYCLE=50; // seconds for one journey at normal speed
function frame(now){
  const dtReal=Math.min(0.05,(now-last)/1000); last=now;
  const dtS=S.playing?dtReal*S.rate:0; S.simTime+=dtS;
  if(S.view==="journey"&&J){ let dc=dtS/CYCLE; if(S.stepTo!=null&&S.playing&&S.t+dc>=S.stepTo){ dc=S.stepTo-S.t+1e-6; S.playing=false; S.stepTo=null; if($("play")) $("play").textContent="Play"; }
    S.t=(S.t+dc)%1; tickJourney(dtS); }
  else if(S.view==="enz"&&EZ) tickEnz(dtS); else if(S.view==="villus"&&VI) tickVillus(dtS);
  S.frameN++; requestAnimationFrame(frame); }
setView("journey");
if(RM) S.playing=false;
requestAnimationFrame(frame);
window.__dig={S,get J(){return J;},get EZ(){return EZ;},get VI(){return VI;},setView};
})();
</script></body></html>
