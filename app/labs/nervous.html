  Y.vis.setAttribute("opacity",S.playing?f1(0.45+0.3*Math.sin(S.frameN*0.15)):"0.4");
  if(S.frameN%6===0&&$("eyestate")){ $("eyestate").innerHTML=`<span>Pupil</span><span class="op" style="color:var(--ink)">${bright?"small (circular muscles contract)":dim?"wide (radial muscles contract)":"medium"}</span><span>Lens</span><span class="op" style="color:var(--ink)">${a>0.55?"fat (ciliary muscle contracted, ligaments slack)":a<0.3?"thin (ciliary muscle relaxed, ligaments tight)":"medium"}</span><span>Image on the retina</span><span class="${sharp?"op":"cl"}">${sharp?"sharp, upside down":"blurred"}</span>`; } }
function eyeSide(){
  const E=S.eye;
  $("side").innerHTML=`<div class="card"><h2>Light into the eye</h2><p style="margin:0;font-size:.9rem">The cornea and lens bend light so that it focuses on the retina, making an upside-down image. Rods and cones in the retina send impulses along the optic nerve to the brain, which turns the picture the right way up.</p>
    <div class="ctl"><label for="elight">Brightness <span id="elv"></span></label><input type="range" id="elight" min="0" max="100" step="1" value="${E.light}"></div>
    <div class="ctl"><label for="edist">Looking at <span id="edv"></span></label><input type="range" id="edist" min="0" max="1" step="0.01" value="${E.dist}"></div>
    <div class="vstate" id="eyestate"></div><div class="row" style="margin-top:10px"><button class="primary" id="play"></button></div>
    <div class="ctl"><label for="rate">Speed <span id="ratev"></span></label><input type="range" id="rate" min="0" max="2" step="1"></div></div>
   <div class="card"><h2>What if…</h2><div class="chips" id="efault">${[["none","Healthy eye"],["short","Short sight"],["long","Long sight"],["old","Old age: a stiff lens"]].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${E.fault===k}">${t}</button>`).join("")}</div><div id="efmsg"></div>
    <div class="row" style="margin-top:8px"><label class="chip"><input type="checkbox" id="lbl" ${S.labels?"checked":""}>Labels</label></div></div>
   <div class="card info" id="info"><h2>Tap any part</h2><div class="chips">${["cornea","iris","pupil","lens","ciliary","ligament","retina","fovea","blind","sclera","optic","cerebrum","cerebellum","medulla"].map(k=>`<button class="chip" data-pick="${k}">${esc(PARTS[k].n)}</button>`).join("")}</div></div>`;
  commonControls();
  const setL=()=>{ E.light=+$("elight").value; $("elv").textContent=E.light<30?"dim":E.light>70?"bright":"normal"; }, setD=()=>{ E.dist=+$("edist").value; $("edv").textContent=E.dist>0.5?"a tree far away":"a book close up"; };
  $("elight").oninput=setL; $("edist").oninput=setD; setL(); setD();
  const FM={none:"",short:"Short sight: the eyeball is too long (or the lens too strong), so light from distant objects focuses in front of the retina. Close objects are clear. Corrected with diverging (concave) lenses. Move the slider to the tree to see it.",long:"Long sight: the eyeball is too short, so light from near objects would focus behind the retina. Distant objects are clear. Corrected with converging (convex) lenses. Move the slider to the book to see it.",old:"With age the lens becomes stiff and cannot get fat enough for close objects, so near things look blurred. Reading glasses help. Move the slider to the book to see it."};
  $("efault").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ E.fault=b.dataset.f; eyeSide(); });
  $("efmsg").innerHTML=E.fault!=="none"?`<div class="msg">${FM[E.fault]}</div>`:"";
  $("side").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>showInfo(b.dataset.pick)); }

// ---------- shared controls, info and quiz ----------
function commonControls(){
  const rates=[0.25,0.5,1], rn=["Very slow","Slow motion","Normal"];
  if(!rates.includes(S.rate)) S.rate=0.5;
  $("rate").value=rates.indexOf(S.rate); const setRate=()=>{ S.rate=rates[+$("rate").value]; $("ratev").textContent=rn[+$("rate").value]; }; $("rate").oninput=setRate; setRate();
  const playLbl=()=>$("play").textContent=S.playing?"Pause":"Play"; $("play").onclick=()=>{ S.playing=!S.playing; playLbl(); }; playLbl();
  if($("lbl")) $("lbl").onchange=e=>{ S.labels=e.target.checked; applyLabels(); }; }
function cur(){ return S.view==="reflex"?RF:S.view==="syn"?SY:EY; }
function applyLabels(){ cur().labs.forEach(l=>l.grp.setAttribute("visibility",S.labels?"visible":"hidden")); }
function dimTo(id){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.toggle("dim",e.dataset.part!==id)); }
function undim(){ cur().svg.querySelectorAll(".part").forEach(e=>e.classList.remove("dim")); }
function showInfo(id){ const p=PARTS[id]; if(!p||!$("info")) return; S.selected=id; dimTo(id);
  $("info").innerHTML=`<h3>${esc(p.n)}</h3><p>${esc(p.t)}</p><div class="row" style="margin-top:6px"><button id="clr">Show everything</button>${id==="synapse"?`<button class="primary" id="gosyn">See a synapse close up</button>`:""}</div>`;
  $("clr").onclick=()=>{ S.selected=null; undim(); setView(S.view); }; if($("gosyn")) $("gosyn").onclick=()=>setView("syn"); }
const QZ=[{tap:"sensory",q:"Tap the sensory neurone."},{tap:"relay",q:"Tap the relay neurone."},{tap:"motor",q:"Tap the motor neurone."},{tap:"effector",q:"Tap the effector."},
 {q:"Which is the correct order in a reflex arc?",o:["Receptor, motor neurone, relay neurone, sensory neurone, effector","Receptor, sensory neurone, relay neurone, motor neurone, effector","Effector, sensory neurone, brain, motor neurone, receptor","Receptor, relay neurone, sensory neurone, effector, motor neurone"],a:1},
 {q:"Why is a reflex faster than a conscious action?",o:["Its neurones are thicker","The impulse does not have to go to the brain to be processed","It uses no synapses","Muscles contract faster in a reflex"],a:1},
 {q:"How does a nerve impulse cross a synapse?",o:["It jumps across as electricity","A neurotransmitter diffuses across the gap","Blood carries it across","The two neurones touch"],a:1},
 {q:"What happens to the pupil in bright light?",o:["It gets bigger","It gets smaller","It stays the same","It moves to the side"],a:1}];
function startQuiz(){ S.quiz={i:0,score:0}; drawQuiz(); }
function drawQuiz(){ const Q=S.quiz, el=$("quiz"); if(!el) return;
  if(Q.i>=QZ.length){ el.innerHTML=`<h2>Test complete</h2><p class="phase" style="font-size:1.6rem;margin:4px 0">${Q.score} / ${QZ.length}</p><p>${Q.score===QZ.length?"Excellent: you know the nervous system.":"Tap the parts you missed to read about them, then try again."}</p><button class="primary" id="qagain">Try again</button>`; $("qagain").onclick=startQuiz;
    try{ parent.postMessage({type:"lablink-3d-result",prac:"nervous",score:Math.round(Q.score/QZ.length*100)},"*"); }catch(e){} Q.done=true; return; }
  const q=QZ[Q.i]; el.innerHTML=`<h2>Question ${Q.i+1} of ${QZ.length}</h2><div class="q"><p><b>${esc(q.q)}</b></p>${q.tap?`<p class="note">Tap it in the picture. Labels are hidden during the test.</p>`:`<div class="opts">${q.o.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join("")}</div>`}</div><div id="qfb"></div>`;
  if(q.tap){ S.labels=false; applyLabels(); }
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o===q.a,b,el.querySelector(`[data-o="${q.a}"]`))); }
function answer(ok,btn,right){ const Q=S.quiz; if(Q.lock) return; Q.lock=true; if(ok) Q.score++; if(btn){ btn.classList.add(ok?"right":"wrong"); if(right) right.classList.add("right"); }
  const q=QZ[Q.i]; $("qfb").innerHTML=`<div class="msg ${ok?"":"warn"}">${ok?"Correct.":q.tap?`Not quite: look at the highlighted part, the ${esc(PARTS[q.tap].n.toLowerCase())}.`:"Not quite: the right answer is highlighted."}</div><button class="primary" id="qnext" style="margin-top:8px">${Q.i+1<QZ.length?"Next question":"See your score"}</button>`;
  if(q.tap&&!ok) dimTo(q.tap);
  $("qnext").onclick=()=>{ Q.lock=false; Q.i++; undim(); if(Q.i>=QZ.length){ S.labels=true; applyLabels(); } drawQuiz(); }; }

// ---------- shell ----------
const LEG={reflex:`<span><i style="background:#2f78b5"></i>Sensory neurone</span><span><i style="background:#8e5bb5"></i>Relay neurone</span><span><i style="background:#c0392b"></i>Motor neurone</span><span><i style="background:#5f8f3a"></i>To and from the brain</span><span><i style="background:#ffd23f"></i>Nerve impulse</span>`,
 syn:`<span><i style="background:#e07b39"></i>Neurotransmitter</span><span><i style="background:#7b5fb0"></i>Receptor (empty)</span><span><i style="background:#ffb000"></i>Receptor (filled)</span><span><i style="background:#3f9a62"></i>Drug</span><span>Magnified about 50 000 times</span>`,
 eye:`<span><i style="background:#f2a900"></i>Light rays</span><span><i style="background:#2f78b5"></i>Image on the retina</span><span><i style="background:#ffd23f"></i>Impulses to the brain; muscles contracting</span>`};
const BELOW={reflex:`<h2>Reflex or conscious action?</h2><div class="tbl"><table><tr><th></th><th>Reflex action</th><th>Conscious (voluntary) action</th></tr><tr><td>Speed</td><td>Very fast, about 50 ms</td><td>Slower, 200 ms or more</td></tr><tr><td>Brain involved?</td><td>No: the relay neurone is in the spinal cord</td><td>Yes: the brain decides</td></tr><tr><td>Do you think about it?</td><td>No, it is automatic</td><td>Yes</td></tr><tr><td>Same every time?</td><td>Yes</td><td>No, it can change</td></tr><tr><td>Examples</td><td>Pulling your hand from heat, blinking, the knee jerk, the pupil reflex</td><td>Writing, kicking a ball, answering a question</td></tr></table></div>`,
 eye:`<h2>Two reflexes in the eye</h2><div class="tbl"><table><tr><th></th><th>Bright light</th><th>Dim light</th></tr><tr><td>Circular muscles of the iris</td><td>Contract</td><td>Relax</td></tr><tr><td>Radial muscles of the iris</td><td>Relax</td><td>Contract</td></tr><tr><td>Pupil</td><td>Smaller, protecting the retina</td><td>Wider, letting in more light</td></tr></table><table style="margin-top:10px"><tr><th></th><th>Looking at a near object</th><th>Looking at a distant object</th></tr><tr><td>Ciliary muscle</td><td>Contracts</td><td>Relaxes</td></tr><tr><td>Suspensory ligaments</td><td>Slack</td><td>Tight</td></tr><tr><td>Lens</td><td>Fatter: bends light more</td><td>Thinner: bends light less</td></tr></table></div>`};
function setView(v){
  S.view=v; document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
  const st=$("stage"); st.innerHTML=""; S.selected=null; S.quiz=null; $("legend").innerHTML=LEG[v]; $("below").hidden=!BELOW[v]; $("below").innerHTML=BELOW[v]||"";
  if(v==="reflex"){ if(!RF) buildReflex(); st.appendChild(RF.svg); reflexSide(); }
  else if(v==="syn"){ if(!SY) buildSyn(); st.appendChild(SY.svg); synSide(); }
  else { if(!EY) buildEye(); st.appendChild(EY.svg); eyeSide(); }
  undim(); applyLabels(); fitLabels(); }
function fitLabels(){ const narrow=innerWidth<600;
  [RF,SY,EY].forEach(V=>{ if(!V) return; V.labs.forEach(l=>{ if(!l.tx) return; const words=l.t.split(" "); l.tx.textContent=""; l.tx.setAttribute("font-size",narrow?22:16);
    if(narrow&&words.length>1){ const cut=Math.ceil(words.length/2); [words.slice(0,cut).join(" "),words.slice(cut).join(" ")].forEach((w,i)=>{ const sp=document.createElementNS(NS,"tspan"); sp.setAttribute("x",l.x); sp.setAttribute("y",l.y+(i?12:-10)); sp.textContent=w; l.tx.appendChild(sp); }); }
    else l.tx.textContent=l.t; }); V.ctx.setAttribute("font-size",narrow?17:13); }); }
addEventListener("resize",fitLabels);
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("stage").addEventListener("click",e=>{ const p=e.target.closest(".part"); if(!p) return; const id=p.dataset.part;
  if(S.view==="reflex"&&S.quiz&&!S.quiz.done&&QZ[S.quiz.i]&&QZ[S.quiz.i].tap&&!S.quiz.lock){ answer(id===QZ[S.quiz.i].tap); return; } showInfo(id); });
$("stage").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("part")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
let last=performance.now();
function frame(now){
  const dtReal=Math.min(0.05,(now-last)/1000); last=now;
  const dt=S.playing?dtReal*S.rate*2:0; S.simTime+=dt;
  if(S.view==="reflex"&&RF) tickReflex(dt); else if(S.view==="syn"&&SY) tickSyn(dt); else if(S.view==="eye"&&EY) tickEye(dtReal);
  S.frameN++; requestAnimationFrame(frame); }
setView("reflex");
if(RM) S.playing=false;
requestAnimationFrame(frame);
window.__nerv={S,get RF(){return RF;},get SY(){return SY;},get EY(){return EY;},setView};
})();
</script></body></html>
